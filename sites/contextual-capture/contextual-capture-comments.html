<!DOCTYPE html>
<title>Contextual Capture Comments</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: a test bench. Device stage on the left, tester controls + tasks + feedback on the right; stacks on narrow screens. */
:root{
  --page:#eef0f2; --panel:#ffffff; --ink:#1c1c1c; --ink-2:#525252; --line:#dcdfe3; --accent:#0870a8; --accent-ink:#ffffff; --chip:#e6e9ec; --ok:#3f7d14;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-head:"Space Grotesk","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#121314;--panel:#1c1d1f;--ink:#f2f2f2;--ink-2:#a9adb3;--line:#2c2e31;--accent:#4fb3e8;--accent-ink:#0b1720;--chip:#2a2c2f;--ok:#7cc24a;color-scheme:dark}}
:root[data-theme="dark"]{--page:#121314;--panel:#1c1d1f;--ink:#f2f2f2;--ink-2:#a9adb3;--line:#2c2e31;--accent:#4fb3e8;--accent-ink:#0b1720;--chip:#2a2c2f;--ok:#7cc24a;color-scheme:dark}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--f-ui);}
.bench{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100%;box-sizing:border-box}
@media (max-width:980px){.bench{grid-template-columns:minmax(0,1fr)}}
.stage-col{display:flex;flex-direction:column;gap:12px;min-width:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.bar h1{font-family:var(--f-head);font-size:20px;font-weight:600;margin:0;letter-spacing:-.01em;text-wrap:balance}
.bar .sub{color:var(--ink-2);font-size:13px}
.seg{display:inline-flex;background:var(--chip);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;color:var(--ink-2);font:500 13px var(--f-ui);padding:6px 10px;border-radius:6px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctl{display:flex;flex-direction:column;gap:4px}
.ctl label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.controls{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
.stage{position:relative;flex:1;min-height:520px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:14px;background:repeating-linear-gradient(45deg,transparent 0 12px,rgba(127,127,127,.05) 12px 24px)}
.device-wrap{position:relative;flex:none}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card-s{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card-s h2{font-family:var(--f-head);font-size:15px;margin:0;font-weight:600}
.card-s p{margin:0;color:var(--ink-2);font-size:13px;line-height:1.45}
.tasks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.tasks li{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.4}
.tasks input{margin-top:2px;accent-color:var(--accent)}
.tasks li.done span{color:var(--ink-2);text-decoration:line-through}
.btn{border:0;border-radius:8px;padding:8px 12px;font:600 13px var(--f-ui);cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--chip);color:var(--ink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.note{font-size:12px;color:var(--ink-2)}
.status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2)}
.status-pill i{width:8px;height:8px;border-radius:50%;background:var(--ok)}

/* ===== Device UI — tokens from 02. Foundations (1.Colours) ===== */
.device{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;border-radius:28px;background:#000;font-family:var(--f-ui);box-shadow:0 0 0 10px #0b0b0c,0 0 0 11px #2a2a2a,0 30px 60px rgba(0,0,0,.35);user-select:none;-webkit-user-select:none}
.device[data-ui="dark"]{--surface:#272727;--primary:#1c1c1c;--quinary:#303030;--quat:#3b3b3b;--t1:#ffffff;--t2:#c8c8c8;--t3:#a3a3a3;--icon:#c8c8c8;--div:#3b3b3b;--sel:#2d3437;--sel-b:#0b9edd;--action:#0870a8;--on-action:#ffffff;--link:#4fb8ea;--ok:#5a9e1b;--warn-ic:#f3b830;--warn-t:#f3b830;--err-t:#ff6b6b;--seg-on:#3b3b3b;--seg-t:#ffffff;--search-b:transparent;--bar:rgba(28,28,28,.94);--elev:rgba(0,0,0,.56);--scrim:rgba(0,0,0,.55);--b-warn:#c8700f;--b-err:#c4262e;--b-sync:#1e7fc2;--b-ok:#3f7d14;--b-off:#3b3b3b;--pin-in:#525252;--pin-in-t:#ffffff;--pin-in-b:#c8c8c8;--sw-res:#90bf57;--sw-reo:#525252}
.device[data-ui="light"]{--surface:#ffffff;--primary:#f6f6f6;--quinary:#f6f6f6;--quat:#e6e6e6;--t1:#1c1c1c;--t2:#525252;--t3:#525252;--icon:#525252;--div:#ededed;--sel:#ebf8ff;--sel-b:#0870a8;--action:#0870a8;--on-action:#ffffff;--link:#0870a8;--ok:#3f7d14;--warn-ic:#c97a12;--warn-t:#525252;--err-t:#c4262e;--seg-on:#ffffff;--seg-t:#1c1c1c;--search-b:#c8c8c8;--bar:rgba(255,255,255,.96);--elev:rgba(82,82,82,.18);--scrim:rgba(0,0,0,.45);--b-warn:#c8700f;--b-err:#fdecec;--b-sync:#eaf5fc;--b-ok:#e9f5e1;--b-off:#ededed;--pin-in:#ffffff;--pin-in-t:#1c1c1c;--pin-in-b:#1c1c1c;--sw-res:#77b22a;--sw-reo:#525252}
.device *{box-sizing:border-box}
.device button{font-family:inherit}
.scene{position:absolute;inset:0;overflow:hidden;background:#111}
.world{position:absolute;transform-origin:0 0;transition:transform .6s cubic-bezier(.2,.7,.2,1)}
.world img{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none}
.scene.placing{cursor:crosshair}
.pin{position:absolute;width:34px;height:34px;margin:-30px 0 0 -6px;transform-origin:6px 30px;border:0;background:transparent;padding:0;cursor:pointer}
.pin svg{width:34px;height:34px;display:block;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
.pin span{position:absolute;left:0;right:0;top:6px;text-align:center;font:700 12px var(--f-ui)}
.pin.bounce{animation:pinIn .35s ease-out}
@keyframes pinIn{from{transform:scale(var(--ps)) translateY(-8px);opacity:0}}
.topbar{position:absolute;display:flex;align-items:center;gap:6px;background:var(--bar);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.25);color:var(--t1);z-index:5}
.topbar .title{flex:1;text-align:center;font-size:15px;font-weight:500;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border:0;border-radius:8px;background:transparent;color:var(--icon);display:grid;place-items:center;cursor:pointer;position:relative;flex:none}
.ib svg{width:22px;height:22px}
.ib.sm{width:32px;height:32px}.ib.sm svg{width:18px;height:18px}
.ib.on{background:var(--sel);color:var(--sel-b)}
.ib:hover{background:var(--quat)}.ib.on:hover{background:var(--sel)}
.ib[disabled]{opacity:.35;cursor:not-allowed}
.ib .dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--sel-b);box-shadow:0 0 0 2px var(--bar)}
.statusbar{position:absolute;left:0;right:0;top:0;height:24px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font:600 12px var(--f-ui);color:#fff;z-index:6;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.joy{position:absolute;left:46px;bottom:46px;width:128px;height:128px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(255,255,255,.12);z-index:3}
.joy::after{content:"";position:absolute;right:-6px;top:0;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.55)}
.hint{position:absolute;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--t1);border-radius:8px;padding:9px 14px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.3);z-index:7;white-space:nowrap;display:flex;gap:10px;align-items:center}
.hint button{border:0;background:transparent;color:var(--link);font:600 13px var(--f-ui);cursor:pointer}

/* panel */
.panel{position:absolute;background:var(--surface);color:var(--t1);display:flex;flex-direction:column;overflow:hidden;z-index:8;box-shadow:0 32px 48px var(--elev)}
.device[data-ui="light"] .panel{outline:1px solid #ededed}
.p-head{padding:8px 8px 0;display:flex;flex-direction:column;gap:6px;flex:none}
.p-title{display:flex;align-items:center;gap:6px;height:36px;padding-left:8px}
.p-title h3{margin:0;font-size:16px;font-weight:600;flex:1;display:flex;align-items:center;gap:8px;color:var(--t1)}
.badge-n{display:inline-grid;place-items:center;min-width:18px;height:18px;padding:0 4px;border-radius:4px;background:var(--sel-b);color:#fff;font:700 11px var(--f-ui)}
.badge-n.ok{background:var(--ok)}
.searchrow{display:flex;align-items:center;gap:6px}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:36px;border-radius:6px;background:var(--quinary);border:1px solid var(--search-b);padding:0 10px;color:var(--t2)}
.search svg{width:16px;height:16px;flex:none}
.search input{flex:1;min-width:0;border:0;background:transparent;color:var(--t1);font:14px var(--f-ui);outline:none}
.search input::placeholder{color:var(--t2)}
.cancel-link{border:0;background:transparent;color:var(--t1);font:500 14px var(--f-ui);cursor:pointer;padding:0 4px}
.segc{display:flex;background:var(--quat);border-radius:6px;padding:4px;gap:4px}
.segc button{flex:1;border:0;background:transparent;color:var(--t2);font:500 13px var(--f-ui);padding:5px 0;border-radius:4px;cursor:pointer}
.segc button[aria-selected="true"]{background:var(--seg-on);color:var(--seg-t);font-weight:600}
.device[data-ui="dark"] .segc button[aria-selected="true"]{color:var(--link)}
.filterline{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--t2);padding:2px 4px 6px}
.filterline button{border:0;background:transparent;color:var(--link);font:600 12px var(--f-ui);cursor:pointer}
.list{flex:1;overflow-y:auto;overflow-x:hidden;border-top:1px solid var(--div);scrollbar-width:thin}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:40px 24px;color:var(--t2);font-size:13px;height:100%}
.empty strong{color:var(--t1);font-size:14px}
.empty svg{width:28px;height:28px;color:var(--t2)}
.cwrap{position:relative;border-bottom:1px solid var(--div);overflow:hidden}
.cwrap{transition:height .22s ease .05s}
.swipe-bg{position:absolute;top:0;right:0;bottom:0;width:var(--rw,0px);display:grid;place-items:center;overflow:hidden;border:0;padding:0;color:#fff;cursor:pointer;transition:width .22s cubic-bezier(.2,.7,.2,1)}
.cwrap.dragging .swipe-bg{transition:none}
.swipe-bg.resolve{background:var(--sw-res)}.swipe-bg.reopen{background:var(--sw-reo)}
.swipe-bg svg{width:24px;height:24px;transition:transform .15s ease}
.swipe-bg.armed svg{transform:scale(1.25)}
.card{will-change:transform}
.card.snap{transition:transform .22s cubic-bezier(.2,.7,.2,1)}
.card{position:relative;background:var(--surface);padding:10px 8px 10px 8px;display:flex;gap:6px;cursor:pointer;transition:background .15s, transform .2s}
.card.dragging{transition:none}
.card.sel{background:var(--sel);box-shadow:inset 3px 0 0 var(--sel-b)}
.card:not(.sel):hover{background:color-mix(in srgb,var(--surface) 92%,var(--t1))}
.av{width:18px;height:18px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 8px var(--f-ui);color:#fff;overflow:hidden;margin-top:1px}
.av img{width:100%;height:100%;object-fit:cover}
.cbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.chead{display:flex;align-items:center;gap:6px;min-width:0}
.cname{font-weight:700;font-size:14px;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.ctime{font-size:12px;color:var(--t2);white-space:nowrap}
.cact{margin-left:auto;display:flex;align-items:center;gap:2px;flex:none}
.cnt{position:relative;width:24px;height:22px;display:grid;place-items:center;color:var(--t2)}
.cnt svg{position:absolute;inset:0;width:24px;height:22px}
.cnt b{position:relative;font:700 9px var(--f-ui);top:-1px}
.cnt.res{color:var(--ok)}
.unread{width:6px;height:6px;border-radius:50%;background:var(--sel-b);margin-left:-12px;margin-top:6px;flex:none;align-self:flex-start}
.ctext{font-size:13px;line-height:1.4;color:var(--t1);overflow-wrap:anywhere;white-space:pre-wrap}
.ctext.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.mention{color:var(--link);font-weight:600}
mark{background:#0b9edd;color:#fff;border-radius:2px;padding:0 1px}
.meta{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--t2);flex-wrap:wrap}
.meta .lnk{color:var(--link);font-weight:500;display:inline-flex;align-items:center;gap:4px;border:0;background:transparent;padding:0;cursor:pointer;font-size:12px}
.meta .warn{color:var(--warn-t);display:inline-flex;align-items:center;gap:4px}
.meta .warn svg{color:var(--warn-ic)}
.meta .err{color:var(--err-t);display:inline-flex;align-items:center;gap:4px}
.meta svg{width:14px;height:14px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img,.thumb-x img{width:52px;height:52px;object-fit:cover;border-radius:4px;display:block;cursor:zoom-in}
.thumb-x{position:relative}
.thumb-x button{position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;border:0;background:#1c1c1c;color:#fff;display:grid;place-items:center;cursor:pointer;font-size:12px;line-height:1}
.replybox{display:flex;align-items:center;height:32px;border-radius:4px;background:var(--quinary);border:1px solid var(--search-b);color:var(--t2);font-size:13px;padding:0 10px;margin-top:4px}
.p-foot{flex:none;display:flex;justify-content:center;padding:14px 16px;background:var(--surface);border-top:1px solid var(--div);box-shadow:0 -4px 16px var(--elev);position:relative;z-index:2}
.btn-p{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:6px;background:var(--action);color:var(--on-action);font:600 14px var(--f-ui);padding:10px 16px;cursor:pointer}
.btn-p svg{width:18px;height:18px}
.btn-p[disabled]{opacity:.4;cursor:not-allowed}
.btn-t{border:0;background:transparent;color:var(--t1);font:500 14px var(--f-ui);padding:8px 10px;border-radius:6px;cursor:pointer}
.btn-t:hover{background:var(--quat)}
.banner{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;font:600 12px var(--f-ui);position:relative;z-index:2;box-shadow:0 -4px 16px var(--elev)}
.banner svg{width:16px;height:16px;flex:none}
.banner button{margin-left:auto;border:0;background:transparent;color:inherit;font:700 12px var(--f-ui);text-decoration:underline;cursor:pointer}
.banner.off{background:var(--b-off);color:var(--t1)}
.banner.warn{background:var(--b-warn);color:#fff}
.banner.sync{background:var(--b-sync);color:var(--t1)}
.device[data-ui="dark"] .banner.sync{color:#fff}
.banner.err{background:var(--b-err);color:var(--err-t)}
.device[data-ui="dark"] .banner.err{color:#fff}
.banner.ok{background:var(--b-ok);color:var(--ok)}
.device[data-ui="dark"] .banner.ok{color:#fff}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* thread */
.thread{flex:1;overflow-y:auto;border-top:1px solid var(--div)}
.tblock{padding:12px 10px;border-bottom:1px solid var(--div);display:flex;gap:6px}
.tblock.root{background:var(--sel);box-shadow:inset 3px 0 0 var(--sel-b)}
.tblock.hit{animation:hit 1.6s ease-out}
@keyframes hit{0%{background:color-mix(in srgb,var(--sel-b) 30%,var(--surface))}}
.composer{flex:none;padding:10px 12px 12px;display:flex;flex-direction:column;gap:8px;background:var(--surface);border-top:1px solid var(--div);box-shadow:0 -4px 16px var(--elev);position:relative}
.field{border-radius:6px;background:var(--quinary);border:1px solid var(--search-b);padding:8px 10px;display:flex;flex-direction:column;gap:8px}
.field:focus-within{border-color:var(--sel-b);box-shadow:0 0 0 1px var(--sel-b)}
.field textarea{width:100%;border:0;background:transparent;color:var(--t1);font:13px/1.45 var(--f-ui);resize:none;outline:none;min-height:20px;max-height:94px;padding:0;overflow-y:auto}
.field textarea::placeholder{color:var(--t2)}
.crow{display:flex;align-items:center;gap:4px}
.crow .sp{flex:1}
.mentions{position:absolute;left:12px;right:12px;bottom:calc(100% - 6px);background:var(--surface);border:1px solid var(--div);border-radius:8px;box-shadow:0 12px 28px rgba(0,0,0,.3);overflow:hidden;z-index:20}
.mentions button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--t1);font:13px var(--f-ui);padding:8px 10px;text-align:left;cursor:pointer}
.mentions button.on,.mentions button:hover{background:var(--sel)}
.mentions .av{width:20px;height:20px}
.mentions small{color:var(--t2);margin-left:auto}

/* create box (iPad) */
.create{position:absolute;width:300px;background:var(--surface);color:var(--t1);border-radius:8px;box-shadow:0 24px 48px rgba(0,0,0,.45);z-index:9;display:flex;flex-direction:column;gap:8px;padding:10px 12px 12px}
.device[data-ui="light"] .create{outline:1px solid #ededed}
.create .chead{gap:8px}
.create .field textarea{min-height:56px}

/* menus, modals, toast */
.menu{position:absolute;min-width:190px;background:var(--surface);color:var(--t1);border-radius:8px;box-shadow:0 16px 36px rgba(0,0,0,.45);padding:6px;z-index:30}
.device[data-ui="light"] .menu{outline:1px solid #ededed}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--t1);font:14px var(--f-ui);padding:9px 10px;border-radius:6px;cursor:pointer;text-align:left}
.menu button:hover{background:var(--quat)}
.menu button[disabled]{opacity:.4;cursor:not-allowed}
.menu button.danger{color:var(--err-t)}
.menu button svg{width:16px;height:16px;flex:none}
.menu .check{margin-left:auto;color:var(--sel-b)}
.menu hr{border:0;border-top:1px solid var(--div);margin:4px 0}
.menu .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--t2);padding:6px 10px 2px}
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:40;display:grid;place-items:center}
.modal{width:300px;background:var(--surface);color:var(--t1);border-radius:12px;overflow:hidden;box-shadow:0 24px 48px rgba(0,0,0,.5)}
.modal .mb{padding:20px 20px 16px;display:flex;flex-direction:column;gap:8px}
.modal h4{margin:0;font-size:17px;font-weight:600}
.modal p{margin:0;font-size:14px;line-height:1.45;color:var(--t2)}
.modal .mf{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--div)}
.modal .mf button{border:0;background:transparent;color:var(--t1);font:600 15px var(--f-ui);padding:14px;cursor:pointer}
.modal .mf button+button{border-left:1px solid var(--div)}
.modal .mf .danger{color:var(--err-t)}
.lightbox img{max-width:80%;max-height:80%;border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.toast{position:absolute;left:50%;transform:translateX(-50%);background:#1c1c1c;color:#fff;border-radius:8px;padding:10px 14px;font:500 13px var(--f-ui);display:flex;gap:14px;align-items:center;z-index:50;box-shadow:0 12px 30px rgba(0,0,0,.4);white-space:nowrap;animation:tin .25s ease-out}
.device[data-ui="light"] .toast{background:#1c1c1c}
.toast button{border:0;background:transparent;color:#4fb8ea;font:700 13px var(--f-ui);cursor:pointer}
.toast.by-panel{left:auto;transform:none;width:max-content;animation:tins .25s ease-out}
@keyframes tins{from{opacity:0;transform:translateX(12px)}}
@keyframes tin{from{opacity:0;transform:translate(-50%,8px)}}

/* iPhone */
.sheet{position:absolute;left:0;right:0;bottom:0;border-radius:14px 14px 0 0;transition:height .3s cubic-bezier(.2,.7,.2,1)}
.grab{height:20px;display:grid;place-items:center;cursor:ns-resize;flex:none}
.grab i{width:40px;height:5px;border-radius:3px;background:var(--quat)}
.addsq{width:32px;height:32px;border:0;border-radius:6px;background:var(--action);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.addsq svg{width:20px;height:20px}
.addsq[disabled]{opacity:.4;cursor:not-allowed}
.hint2{position:absolute;left:12px;right:12px;top:100px;z-index:7;background:var(--surface);color:var(--t2);border:1px solid var(--sel-b);border-radius:6px;padding:10px 12px;font-size:13px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.hint2 span{flex:1}
.hint2 button{border:0;background:transparent;color:var(--link);font:600 13px var(--f-ui);cursor:pointer}
.expand{position:absolute;right:16px;top:104px;width:40px;height:40px;border-radius:8px;background:var(--bar);color:var(--icon);border:0;display:grid;place-items:center;z-index:4;cursor:pointer}
.expand svg{width:20px;height:20px}
.tb-sep{width:1px;height:28px;background:var(--div);margin:0 4px;flex:none}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:12;background:var(--surface);border-top:1px solid var(--div);box-shadow:0 -4px 16px var(--elev);padding:10px 12px 28px;display:flex;flex-direction:column;gap:8px}
.dock .row2{display:flex;align-items:flex-end;gap:8px}
.dock .field{flex:1}
.dock .ib{width:40px;height:40px}
.sendb{width:40px;height:40px;border:0;border-radius:8px;background:var(--action);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}
.sendb svg{width:20px;height:20px}
.sendb[disabled]{background:var(--quat);color:var(--t2);cursor:not-allowed}
.kb{height:250px;background:#2b2b2d;display:grid;grid-template-rows:repeat(4,1fr);gap:8px;padding:8px 4px 30px}
.device[data-ui="light"] .kb{background:#d1d4da}
.kb div{display:flex;gap:5px;justify-content:center}
.kb span{flex:0 0 8.6%;border-radius:5px;background:#5e5e60;display:grid;place-items:center;color:#fff;font:400 18px var(--f-ui)}
.device[data-ui="light"] .kb span{background:#fff;color:#000}
@media (prefers-reduced-motion:reduce){.world,.sheet,.card,.toast,.pin{transition:none!important;animation:none!important}}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>

function authorKey(a){return a.p?"p:"+a.p:"u:"+a.id}

function nameOf(a){if(!a)return"Someone";if(a.p)return PERSONAS[a.p]?.name||"Someone";if(a.local)return me.name||"You";if(me.id&&a.id===me.id)return me.name||"You";return profiles[a.id]?.name||"Someone"}
function avatar(a,size){
  const s=size||18;
  if(a&&a.p){const p=PERSONAS[a.p];const ini=p.name.split(" ").map(x=>x[0]).join("");return `<span class="av" style="width:${s}px;height:${s}px;background:${p.color}">${ini}</span>`}

  if(prof&&prof.avatarUrl)return `<span class="av" style="width:${s}px;height:${s}px;background:${esc(prof.color||"#0870a8")}"><img alt="" src="${esc(prof.avatarUrl)}"></span>`;

}
function myAuthor(){return me.id?{id:me.id}:{local:true}}
function allComments(){
  const m=new Map(); remote.forEach((v,k)=>m.set(k,{...JSON.parse(JSON.stringify(v)),id:k}));
  for(const op of pending){
    if(op.op==="create"){m.set(op.id,{...op.data,id:op.id,_pending:op.failed?"failed":"waiting"});}
    else if(op.op==="reply"){const c=m.get(op.id);if(c){c.replies=[...(c.replies||[]),{...op.data,_pending:op.failed?"failed":"waiting"}];}}
  }

}

async function write(op,id,data){
  // op: create | reply | update | delete
  if(ui.conn!=="online"&&(op==="create"||op==="reply")){pending.push({op,id,data,failed:ui.conn==="error"});render();return true}
  if(mode==="db"){
    try{
      const ref=db.collection("comments").doc(id);
      if(op==="create")await ref.set(data);
      else if(op==="reply"){const c=remote.get(id);await ref.update({replies:[...(c?.replies||[]),data]});}
      else if(op==="update")await ref.update(data);
      else if(op==="delete")await ref.delete();
      return true;
    }catch(e){toast(e&&e.code==="invalid_argument"?"You can view this test but not post. Ask the owner for Contributor access.":"Couldn’t save. Check your connection and try again.");return false}
  }else{
    const c=remote.get(id);
    if(op==="create")remote.set(id,data);
    else if(op==="reply"&&c)c.replies=[...(c.replies||[]),data];
    else if(op==="update"&&c)Object.assign(c,data);
    else if(op==="delete")remote.delete(id);
    render();return true;
  }
}
async function flushPending(){
  if(!pending.length)return;
  ui.syncState="syncing";render();
  await new Promise(r=>setTimeout(r,1400));
  if(ui.conn!=="online"){ui.syncState=null;render();return}
  const ops=pending;pending=[];
  for(const o of ops){
    if(o.op==="create"){await write("create",o.id,o.data)}
    else if(o.op==="reply"){if(mode==="db"){const c=remote.get(o.id);try{await db.collection("comments").doc(o.id).update({replies:[...(c?.replies||[]),o.data]});remote.set(o.id,{...c,replies:[...(c?.replies||[]),o.data]})}catch(e){}}else{await write("reply",o.id,o.data)}}
  }
  ui.syncState="synced";render();
  setTimeout(()=>{if(ui.syncState==="synced"){ui.syncState=null;render()}},2200);
}

function visibleList(){

    const q=ui.q.trim().toLowerCase();
    list=list.filter(c=>c.text.toLowerCase().includes(q)||nameOf(c.author).toLowerCase().includes(q)||c.replies.some(r=>r.text.toLowerCase().includes(q)||nameOf(r.author).toLowerCase().includes(q)));
  }else{
    list=list.filter(c=>ui.tab==="open"?!c.resolved:!!c.resolved);

function richText(text,mentions,q){
  // split on mentions of known names, highlight search query inside plain segments
  const names=[];(mentions||[]).forEach(k=>{const a=k.startsWith("p:")?{p:k.slice(2)}:{id:k.slice(2)};const n=nameOf(a);if(n&&n!=="Someone")names.push(n)});
  let parts=[{t:text,m:false}];
  names.forEach(n=>{const tok="@"+n;parts=parts.flatMap(p=>{if(p.m)return[p];const out=[];let s=p.t,i;while((i=s.indexOf(tok))>=0){if(i)out.push({t:s.slice(0,i),m:false});out.push({t:tok,m:true});s=s.slice(i+tok.length)}if(s)out.push({t:s,m:false});return out})});

}
async function saveEdit(){
  const e=ui.edit;const c=allComments().find(x=>x.id===e.id);if(!c||!e.text.trim())return;
  if(e.rid)await write("update",c.id,{replies:c.replies.filter(r=>!r._pending).map(r=>r.id===e.rid?{...r,text:e.text.trim(),edited:true}:r)});
  else await write("update",c.id,{text:e.text.trim(),edited:true});
  ui.edit=null;render();toast("Changes saved");
}
async function addFiles(files,target){
  const out=[];
  for(const f of [...files].slice(0,6)){
    if(!f.type.startsWith("image/"))continue;
    const url=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(f)});
    const img=await new Promise(res=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>res(null);i.src=url});if(!img)continue;
    const s=Math.min(1,420/Math.max(img.width,img.height));const cv=document.createElement("canvas");cv.width=Math.round(img.width*s);cv.height=Math.round(img.height*s);cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
    out.push(cv.toDataURL("image/jpeg",.68));
  }
  const bucket=target==="draft"?ui.draft.atts:ui.reply.atts;
  const room=4-bucket.length; if(out.length>room)toast("Up to 4 images per comment in this prototype");
  bucket.push(...out.slice(0,Math.max(0,room)));render();
}
let attachTarget="draft";
$("#filePick").addEventListener("change",e=>{if(e.target.files?.length)addFiles(e.target.files,attachTarget);e.target.value=""});

/* mentions */
async function mentionCandidates(q){
  const list=Object.entries(PERSONAS).map(([k,p])=>({author:{p:k},name:p.name,key:"p:"+k}));
  if(me.id)list.unshift({author:{id:me.id},name:me.name||"You",key:"u:"+me.id,you:true});
  if(userCap&&q.length>=1){try{const hits=await userCap.search(q);hits.forEach(h=>{if(h.id!==me.id&&!list.some(x=>x.key==="u:"+h.id)){profiles[h.id]={name:h.name,avatarUrl:h.avatarUrl,color:h.color};list.push({author:{id:h.id},name:h.name,key:"u:"+h.id})}})}catch(e){}}
  const ql=q.toLowerCase();return list.filter(x=>x.name.toLowerCase().includes(ql)).slice(0,6);
}
async function onTyping(el,target){
  const v=el.value,pos=el.selectionStart;const before=v.slice(0,pos);const m=before.match(/@([\p{L} .'-]{0,24})$/u);
  if(m&&!/\s{2}/.test(m[1])){const q=m[1];const list=await mentionCandidates(q.trim());ui.mention={target,start:pos-m[0].length,end:pos,list,idx:0};}
  else ui.mention=null;
  // re-render only the suggestions + send state without destroying the field
  render();
}
function pickMention(i){
  const m=ui.mention;if(!m)return;const p=m.list[i];if(!p)return;
  const obj=m.target==="draft"?ui.draft:ui.reply;const v=obj.text;
  obj.text=v.slice(0,m.start)+"@"+p.name+" "+v.slice(m.end);obj.mentions=[...(obj.mentions||[]),p.key];
  ui.mention=null;render();const el=$(m.target==="draft"?"#draftText":"#replyText");if(el){const c=m.start+p.name.length+2;el.focus();el.setSelectionRange(c,c)}
}

dev.addEventListener("input",e=>{
  const t=e.target;
  if(t.id==="q"){ui.q=t.value;if(!ui.search){ui.search=true}ui.sel=null;if(ui.device==="iphone"&&ui.q.trim()&&ui.sheet==="collapsed")ui.sheet="half";render();if(ui.q.trim().toLowerCase()==="lawn"&&visibleList().length)doneTask(4);return}
  if(t.id==="draftText"){ui.draft.text=t.value;onTyping(t,"draft");return}
  if(t.id==="replyText"){ui.reply.text=t.value;onTyping(t,"reply");return}
  if(t.id==="editText"){ui.edit.text=t.value;autoGrow();return}
});
dev.addEventListener("focusin",e=>{if(e.target.id==="q"&&!ui.search){ui.search=true;ui.view="list";render()}});
dev.addEventListener("keydown",e=>{
  const t=e.target;
  if(ui.mention&&(t.id==="draftText"||t.id==="replyText")){
    if(e.key==="ArrowDown"){e.preventDefault();ui.mention.idx=(ui.mention.idx+1)%ui.mention.list.length;render();return}
    if(e.key==="ArrowUp"){e.preventDefault();ui.mention.idx=(ui.mention.idx-1+ui.mention.list.length)%ui.mention.list.length;render();return}
    if(e.key==="Enter"||e.key==="Tab"){e.preventDefault();pickMention(ui.mention.idx);return}
    if(e.key==="Escape"){ui.mention=null;render();return}
  }
  if(e.key==="Enter"&&(e.metaKey||e.ctrlKey)){if(t.id==="draftText")postDraft();if(t.id==="replyText")sendReply();if(t.id==="editText")saveEdit()}
  if(e.key==="Enter"&&t.classList.contains("card")){t.click()}
  if(e.key==="Escape"){if(ui.menu){ui.menu=null;render()}else if(ui.modal){ui.modal=null;render()}else if(ui.mode)act("cancelDraft")}
});

function act(a,el,e){
  const id=el?.dataset.id;
  switch(a){
    case"scene":{
      if(ui.menu){ui.menu=null;render();return}
      if(ui.mode==="placing"){placeAt(e.clientX,e.clientY);return}
      if(ui.mode==="creating"){return}
      if(ui.sel&&ui.view==="list"){ui.sel=null;aimCamera(null);render()}
      return}
    case"pin":{if(ui.mode)return;ui.panel=true;const c=allComments().find(x=>x.id===id);if(c){if(!ui.search)ui.tab=c.resolved?"resolved":"open";ui.view="list";ui.sel=null;select(id);doneTask(0)}return}
    case"select":if(el.classList.contains("dragging"))return;select(id);doneTask(0);return;
    case"thread":openThread(id,el.dataset.focus==="1");return;
    case"backList":ui.view="list";ui.edit=null;ui.mention=null;if(ui.device==="iphone")ui.sheet="half";render();return;
    case"tab":ui.tab=el.dataset.tab;ui.sel=null;aimCamera(null);render();return;
    case"openSearch":ui.search=true;ui.view="list";render();setTimeout(()=>$("#q")?.focus(),30);return;
    case"clearQ":ui.q="";render();setTimeout(()=>$("#q")?.focus(),30);return;
    case"togglePanel":if(ui.mode){act("cancelDraft");return}ui.panel=!ui.panel;ui.menu=null;if(!ui.panel){ui.sel=null;aimCamera(null)}else if(ui.sel)aimCamera(allComments().find(c=>c.id===ui.sel));render();return;
    case"closePanel":ui.panel=false;ui.sel=null;ui.view="list";aimCamera(null);render();return;
    case"grab":ui.sheet=ui.sheet==="full"?"half":"full";render();return;
    case"cancelSearch":ui.search=false;ui.q="";ui.sel=null;aimCamera(null);render();return;
    case"filterMenu":{const r=el.getBoundingClientRect(),p=devPoint({clientX:r.right,clientY:r.bottom});ui.menu={type:"filter",x:Math.max(8,p.x-220),y:p.y+6};render();return}
    case"fMentions":ui.filter={mentions:!ui.filter.mentions,by:null};ui.menu=null;render();if(ui.filter.mentions)doneTask(5);return;
    case"fBy":ui.filter={mentions:false,by:ui.filter.by===el.dataset.k?null:el.dataset.k};ui.menu=null;render();return;
    case"clearFilter":ui.filter={mentions:false,by:null};ui.menu=null;render();return;
    case"more":{const r=el.getBoundingClientRect(),p=devPoint({clientX:r.right,clientY:r.bottom});const D0=DEV[ui.device];ui.menu={type:"item",id,rid:el.dataset.rid||null,x:Math.max(8,Math.min(p.x-196,D0.w-210)),y:Math.min(p.y+4,D0.h-230)};render();return}
    case"swipeAction":commitSwipe(id);return;
    case"resolve":setResolved(id,true);return;
    case"reopen":setResolved(id,false);return;
    case"edit":{const c=allComments().find(x=>x.id===id);const rid=el.dataset.rid||null;const t=rid?c.replies.find(r=>r.id===rid):c;ui.menu=null;if(ui.view!=="thread"){ui.view="thread";ui.threadId=id;ui.sel=id}ui.edit={id,rid,text:t.text};render();setTimeout(()=>{const x=$("#editText");if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length)}},30);return}
    case"cancelEdit":ui.edit=null;render();return;
    case"saveEdit":saveEdit();return;
    case"copy":{const c=allComments().find(x=>x.id===id);const rid=el.dataset.rid;const t=rid?c.replies.find(r=>r.id===rid):c;ui.menu=null;const done=()=>toast("Text copied");try{navigator.clipboard.writeText(t.text).then(done,()=>toast("Copy isn’t available here"))}catch(err){toast("Copy isn’t available here")}render();return}
    case"askDelete":ui.menu=null;ui.modal={type:"delete",id,rid:el.dataset.rid||null};render();return;
    case"confirmDelete":doDelete();return;
    case"closeModal":ui.modal=null;render();return;
    case"add":startAdd();return;
    case"cancelPlacing":endDraft();return;
    case"cancelDraft":if(ui.mode==="creating"&&hasDraftContent()){ui.modal={type:"discard"};render()}else endDraft();return;
    case"keepEditing":ui.modal=null;render();setTimeout(()=>$("#draftText")?.focus(),30);return;
    case"confirmDiscard":ui.modal=null;endDraft();return;
    case"postDraft":postDraft();return;
    case"sendReply":sendReply();return;
    case"cancelReply":ui.reply={text:"",atts:[]};ui.mention=null;render();return;
    case"attach":attachTarget=el.dataset.target;$("#filePick").click();return;
    case"rmAtt":{const b=el.dataset.target==="draft"?ui.draft.atts:ui.reply.atts;b.splice(+el.dataset.i,1);render();return}
    case"pickMention":pickMention(+el.dataset.i);return;
    case"zoom":{const c=allComments().find(x=>x.id===id);const rid=el.dataset.rid;const arr=rid?c.replies.find(r=>r.id===rid).atts:c.attachments;ui.lightbox=arr[+el.dataset.src];render();return}
    case"closeLight":ui.lightbox=null;render();return;
    case"undo":{const u=ui.toast?.undo;ui.toast=null;if(u&&u.op==="resolve")write("update",u.id,{resolved:u.val}).then(render);return}
    case"retry":ui.conn="online";flushPending();return;
    case"exit":toast("Back to the project. Not part of this prototype");return;
    case"na":toast("Not part of this prototype");return;
  }
}
dev.addEventListener("click",e=>{
  if(suppressClick){suppressClick=false;return}
  const el=e.target.closest("[data-act]");
  if(ui.menu&&!e.target.closest(".menu")&&(!el||!["more","filterMenu"].includes(el.dataset.act))){ui.menu=null;render();if(!el||el.dataset.act==="scene")return}
  if(!el)return;
  if(el.dataset.act==="scene"&&e.target.closest(".pin"))return;
  act(el.dataset.act,el,e);
});

/* swipe to resolve / reopen */
let drag=null, suppressClick=false;
let hold=null, grabD=null;
function placeAt(cx,cy){
  const w=$("#world").getBoundingClientRect();
  if(!ui.draft)ui.draft={x:null,y:null,text:"",atts:[],mentions:[]};
  ui.draft.x=Math.min(.98,Math.max(.02,(cx-w.left)/w.width));ui.draft.y=Math.min(.98,Math.max(.04,(cy-w.top)/w.height));
  ui.mode="creating";ui.menu=null;ui.sel=null;render();setTimeout(()=>$("#draftText")?.focus(),30);
}
dev.addEventListener("pointerdown",e=>{
  const g=e.target.closest(".grab");if(g){grabD={y:e.clientY};return}
  if(e.target.closest(".scene")&&!e.target.closest(".pin")&&!ui.modal&&ui.mode!=="creating"){
    const x=e.clientX,y=e.clientY;clearTimeout(hold?.t);
    hold={x,y,t:setTimeout(()=>{hold=null;suppressClick=true;placeAt(x,y)},420)};
  }
});
dev.addEventListener("pointermove",e=>{if(hold&&Math.hypot(e.clientX-hold.x,e.clientY-hold.y)>10){clearTimeout(hold.t);hold=null}});
dev.addEventListener("pointerup",e=>{
  if(hold){clearTimeout(hold.t);hold=null}
  if(grabD){const dy=(e.clientY-grabD.y)/(dev._s||1);grabD=null;const order=["collapsed","half","full"];let i=order.indexOf(ui.sheet);
    if(dy>40)i=Math.max(0,i-1);else if(dy<-40)i=Math.min(2,i+1);else i=ui.sheet==="collapsed"?1:ui.sheet==="half"?2:1;
    ui.sheet=order[i];if(ui.sheet!=="full"&&ui.view==="thread"){ui.view="list"}render();}
});
function swipeParts(id){const w=dev.querySelector(`.cwrap[data-cid="${id}"]`);return w?{wrap:w,card:w.querySelector(".card"),bg:w.querySelector(".swipe-bg")}:null}
function closeSwipe(){if(!ui.swipeOpen)return;const p=swipeParts(ui.swipeOpen);ui.swipeOpen=null;if(p){p.card.classList.add("snap");p.card.style.transform="";p.bg.style.setProperty("--rw","0px");setTimeout(()=>p.card.classList.remove("snap"),240)}}
function commitSwipe(id){
  const p=swipeParts(id);const c=allComments().find(x=>x.id===id);if(!c)return;
  if(ui.conn!=="online"||!canAct(c)){if(p){p.card.classList.add("snap");p.card.style.transform="";p.bg.style.setProperty("--rw","0px")}ui.swipeOpen=null;setResolved(id,!c.resolved);return}
  ui.swipeOpen=null;
  if(!p){setResolved(id,!c.resolved);return}
  const W=p.wrap.offsetWidth;p.wrap.classList.add("dragging");p.card.classList.add("snap");p.card.style.transform=`translateX(-${W}px)`;p.bg.style.transition="width .22s cubic-bezier(.2,.7,.2,1)";p.bg.style.setProperty("--rw",W+"px");
  setTimeout(()=>{p.wrap.style.height=p.wrap.offsetHeight+"px";requestAnimationFrame(()=>{p.wrap.style.height="0px"})},260);
  setTimeout(()=>setResolved(id,!c.resolved),520);
}
dev.addEventListener("pointerdown",e=>{
  const card=e.target.closest(".card");
  if(ui.swipeOpen&&!e.target.closest(`.cwrap[data-cid="${ui.swipeOpen}"] .swipe-bg`)&&!(card&&card.dataset.id===ui.swipeOpen)){closeSwipe()}
  if(!card||e.target.closest("button,textarea,input,img"))return;
  const base=ui.swipeOpen===card.dataset.id?-SW_OPEN:0;
  drag={card,bg:card.parentElement.querySelector(".swipe-bg"),x:e.clientX,y:e.clientY,base,dx:base,active:false,id:card.dataset.id,W:card.parentElement.offsetWidth};
});
dev.addEventListener("pointermove",e=>{
  if(!drag)return;const s=dev._s||1;const mx=(e.clientX-drag.x)/s,my=(e.clientY-drag.y)/s;
  if(!drag.active){if(Math.abs(mx)>8&&Math.abs(mx)>Math.abs(my)){drag.active=true;drag.card.parentElement.classList.add("dragging");try{drag.card.setPointerCapture(e.pointerId)}catch(err){}}else return}
  drag.dx=Math.min(0,Math.max(-drag.W,drag.base+mx));
  drag.card.style.transform=`translateX(${drag.dx}px)`;drag.bg.style.setProperty("--rw",(-drag.dx)+"px");
  drag.bg.classList.toggle("armed",-drag.dx>=drag.W*.5);
});
const endDrag=()=>{
  if(!drag)return;const d=drag;drag=null;if(!d.active)return;
  suppressClick=true;setTimeout(()=>{suppressClick=false},50);
  d.card.parentElement?.classList.remove("dragging");d.bg.classList.remove("armed");
  const dist=-d.dx;
  if(dist>=d.W*.5){commitSwipe(d.id);return}
  d.card.classList.add("snap");setTimeout(()=>d.card.classList.remove("snap"),240);
  if(dist>=40){ui.swipeOpen=d.id;d.card.style.transform=`translateX(-${SW_OPEN}px)`;d.bg.style.setProperty("--rw",SW_OPEN+"px")}
  else{if(ui.swipeOpen===d.id)ui.swipeOpen=null;d.card.style.transform="";d.bg.style.setProperty("--rw","0px")}
};
dev.addEventListener("pointerup",endDrag);dev.addEventListener("pointercancel",endDrag);

/* bench controls */
document.querySelector("#segDevice").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;ui.device=b.dataset.dev;ls.set("cc.device",ui.device);ui.menu=null;if(ui.mode)endDraft();ui.sheet="half";aimCamera(ui.sel?allComments().find(c=>c.id===ui.sel):null);render();if(ui.device==="iphone")checkCombo()});
document.querySelector("#segTheme").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;ui.theme=b.dataset.ui;ls.set("cc.theme",ui.theme);render();checkCombo()});
document.querySelector("#segConn").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const prev=ui.conn;ui.conn=b.dataset.conn;ui.syncState=null;
  pending.forEach(p=>p.failed=ui.conn==="error");render();
  if(ui.conn==="online"&&prev!=="online"&&pending.length){flushPending().then(()=>doneTask(6))}});
document.querySelector("#segRights").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;ui.rights=b.dataset.rights;ui.menu=null;render();toast(ui.rights==="edit"?"You can resolve anyone’s comments":"View-only: you can comment and reply, not resolve others’ comments")});
function checkCombo(){if(ui.device==="iphone"&&ui.theme==="light")doneTask(7)}
new ResizeObserver(fit).observe(stage);

/* tasks */
function renderTasks(){const ul=$("#tasks");ul.innerHTML=TASKS.map((t,i)=>`<li class="${tasksDone.includes(i)?"done":""}"><input type="checkbox" id="task${i}" ${tasksDone.includes(i)?"checked":""}><span><label for="task${i}">${esc(t)}</label></span></li>`).join("")}
$("#tasks").addEventListener("change",e=>{const i=+e.target.id.slice(4);const k=tasksDone.indexOf(i);if(e.target.checked&&k<0)tasksDone.push(i);if(!e.target.checked&&k>=0)tasksDone.splice(k,1);ls.set("cc.tasks",tasksDone);renderTasks()});
renderTasks();

/* ---------- boot ---------- */
function loadLocal(){
  mode="local";remote=new Map();const now=Date.now();
  SAMPLE.forEach(s=>{const id="ex"+s.num;remote.set(id,{num:s.num,x:s.x,y:s.y,text:s.text,author:s.author,createdAt:now-s.ago,resolved:!!s.resolved,attachments:[],mentions:s.mentions||[],replies:s.replies.map((r,i)=>({id:id+"r"+i,author:r.author,text:r.text,createdAt:now-r.ago,mentions:[]}))})});
  $("#modeNote").textContent="Sandbox mode: example comments, changes stay in this tab";
  render();
}
async function resolveProfiles(){
  if(!userCap)return;const ids=new Set();allComments().forEach(c=>{if(c.author.id)ids.add(c.author.id);c.replies.forEach(r=>{if(r.author.id)ids.add(r.author.id)});(c.mentions||[]).forEach(k=>{if(k.startsWith("u:"))ids.add(k.slice(2))})});
  if(!ids.size)return;try{const ps=await userCap.profiles([...ids]);let changed=false;for(const [k,v] of Object.entries(ps)){if(!profiles[k]||profiles[k].name!==v.name){changed=true}profiles[k]={name:v.name,avatarUrl:v.avatarUrl,color:v.color}}if(changed)render()}catch(e){}
}
async function boot(){
  render();
  const use=window.claude&&window.claude.use;
  if(!use){loadLocal();return}
  try{
    const [d,u]=await Promise.all([use("db"),use("user")]);
    userCap=u;
    if(u){const m=await u.me();me={...me,...m};}
    if(!d){loadLocal();return}
    db=d;mode="db";
    $("#modeNote").textContent="Loading shared comments…";
    let first=true;const t=setTimeout(()=>{if(first)$("#modeNote").textContent="Shared comments can’t be reached yet. Showing what’s loaded."},10000);
    db.collection("comments").onSnapshot(snap=>{
      const m=new Map();snap.docs.forEach(doc=>m.set(doc.id,doc.data()));remote=m;
      if(!snap.metadata.fromCache&&first){first=false;clearTimeout(t);$("#modeNote").innerHTML='<span class="status-pill"><i></i>Live: comments are shared with everyone on this link</span>'}
      render();resolveProfiles();
    },err=>{clearTimeout(t);$("#modeNote").textContent="Shared comments are unavailable. Switched to sandbox mode.";loadLocal()});
  }catch(e){loadLocal()}
}
setInterval(()=>{if(!document.hidden&&!ui.mode&&!document.activeElement?.matches?.("textarea,input"))render()},60000);
boot();
})();
</script>
