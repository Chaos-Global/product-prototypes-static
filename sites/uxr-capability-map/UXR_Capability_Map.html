<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>UXR Capability Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
html{color-scheme:light}
/* Layout: sticky toolbar, three working views (Team map / Individual / Planning), content on a cool paper ground with one ultramarine accent and a 5-step proficiency ramp. */
:root{
  --av-bg:88%; --av-fg:28%;
  --p0:#2C46D8; --p1:#C9531B; --p2:#0F7F63; --p3:#B02C6C; --p4:#7348C4; --p5:#7D6400; --p6:#0B76A3; --p7:#C0303A; --p8:#3F7A16; --p9:#995019; --p10:#4D5870; --p11:#C23C93;
  --bg:#F2F3F7; --surface:#FFFFFF; --sunk:#E9EBF1; --ink:#151925; --muted:#454C5E; --line:#CBD0DC;
  --accent:#2C46D8; --accent-ink:#FFFFFF; --accent-soft:#E3E7FB;
  --ok:#11795A; --ok-soft:#DDF2EA; --warn:#A85A0C; --warn-soft:#FBEBD8; --crit:#B3263A; --crit-soft:#F8E0E3;
  --h0:#EDEFF4; --h1:#DCE2FA; --h2:#B4C0F3; --h3:#8597EC; --h4:#3A54D6; --h5:#1A2894; --i1:#151925; --i2:#151925; --i3:#0D1226; --i4:#FFFFFF; --i5:#FFFFFF;
  --t-team:#9AA1B4; --t-tgt:#D97A1E;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --av-bg:26%; --av-fg:84%;
  --p0:#8D9DFF; --p1:#FF9A5C; --p2:#3FD0A6; --p3:#FF7EB6; --p4:#B79BFF; --p5:#E2C64A; --p6:#55C3F2; --p7:#FF7A80; --p8:#9AD660; --p9:#E0A06A; --p10:#AAB4CC; --p11:#F68AD6;
  --bg:#0E1119; --surface:#161A25; --sunk:#1D2230; --ink:#E7E9F0; --muted:#B0B7C8; --line:#363D52;
  --accent:#8193FF; --accent-ink:#0E1119; --accent-soft:#232B4D;
  --ok:#4CC79C; --ok-soft:#173329; --warn:#F0A65A; --warn-soft:#3A2A18; --crit:#F17A8B; --crit-soft:#3C1C23;
  --h0:#1A1F2D; --h1:#222B4A; --h2:#2E3E85; --h3:#4A5ECF; --h4:#8A9BFA; --h5:#C3CCFF; --i1:#E7E9F0; --i2:#FFFFFF; --i3:#FFFFFF; --i4:#0B0E18; --i5:#0B0E18;
  --t-team:#6B7389; --t-tgt:#F0A65A; color-scheme:dark}}
:root[data-theme="dark"]{
  --av-bg:26%; --av-fg:84%;
  --p0:#8D9DFF; --p1:#FF9A5C; --p2:#3FD0A6; --p3:#FF7EB6; --p4:#B79BFF; --p5:#E2C64A; --p6:#55C3F2; --p7:#FF7A80; --p8:#9AD660; --p9:#E0A06A; --p10:#AAB4CC; --p11:#F68AD6;
  --bg:#0E1119; --surface:#161A25; --sunk:#1D2230; --ink:#E7E9F0; --muted:#B0B7C8; --line:#363D52;
  --accent:#8193FF; --accent-ink:#0E1119; --accent-soft:#232B4D;
  --ok:#4CC79C; --ok-soft:#173329; --warn:#F0A65A; --warn-soft:#3A2A18; --crit:#F17A8B; --crit-soft:#3C1C23;
  --h0:#1A1F2D; --h1:#222B4A; --h2:#2E3E85; --h3:#4A5ECF; --h4:#8A9BFA; --h5:#C3CCFF; --i1:#E7E9F0; --i2:#FFFFFF; --i3:#FFFFFF; --i4:#0B0E18; --i5:#0B0E18;
  --t-team:#6B7389; --t-tgt:#F0A65A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px;padding-block:0 110px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:22px;font-weight:700}
h2{font-size:19px;font-weight:700}
h3{font-size:15px;font-weight:700}
.eyebrow{font:500 11px/1.2 var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:12px}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand .dot{width:10px;height:10px;border-radius:2px;background:linear-gradient(135deg,var(--h2),var(--h5));align-self:center}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.tabs{display:flex;gap:4px}
.tabs button{border:0;background:none;padding:8px 12px;border-radius:6px;font-weight:600;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}

.banner{margin-top:16px;padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);font-weight:500}
section.view{display:grid;gap:20px;margin-top:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 16px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,360px),1fr));gap:20px}

/* stat row */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.stat b{display:block;font:500 26px/1.1 var(--mono);margin-top:6px}
.stat small{color:var(--muted)}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font:500 11px/1 var(--body);padding:4px 7px;border-radius:999px;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.crit{background:var(--crit-soft);color:var(--crit)}
.chip.plain{background:var(--sunk);color:var(--ink)}

/* category bars */
.catbars{display:grid;gap:10px}
.cb{display:grid;grid-template-columns:minmax(120px,210px) 1fr 70px;gap:12px;align-items:center}
.cb .track{position:relative;height:12px;background:var(--sunk);border-radius:3px}
.cb .fill{position:absolute;inset:0 auto 0 0;background:var(--h4);border-radius:3px}
.cb .tgt{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--t-tgt);border-radius:2px}
.cb .lbl{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scale{display:flex;justify-content:space-between;font:11px var(--mono);color:var(--muted);margin-left:calc(min(210px,40%) + 12px);margin-right:82px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;vertical-align:-2px;margin-right:5px}

/* heatmap */
.hm-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table.hm{border-collapse:separate;border-spacing:0;font-size:12.5px;width:100%}
.hm th,.hm td{padding:0;text-align:center}
.hm thead th{position:sticky;top:0;background:var(--surface);font-weight:600;padding:8px 2px;border-bottom:1px solid var(--line);z-index:2}
.hm thead th.person{min-width:38px;cursor:pointer}
.hm thead th.person span{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sunk);font:600 11px var(--mono)}
.hm thead th.person:hover span{background:var(--accent-soft);color:var(--accent)}
.hm .sk{position:sticky;left:0;background:var(--surface);text-align:left;padding:4px 12px;min-width:220px;max-width:280px;font-weight:400;z-index:1;border-right:1px solid var(--line)}
.hm tr.cat td{background:var(--sunk);text-align:left;padding:7px 12px;font:600 12px var(--body);position:sticky;left:0}
.hm td.c{height:30px;min-width:38px;border:2px solid var(--surface);border-radius:6px;font:500 12px var(--mono)}
.hm td.agg{font:500 12px var(--mono);padding:0 8px;white-space:nowrap;border-left:1px solid var(--line)}
.hm td.st{padding:0 10px;text-align:left;border-left:1px solid var(--line)}
.hm tbody tr:hover .sk{color:var(--accent)}
.v0{background:var(--h0);color:var(--muted)} .v1{background:var(--h1);color:var(--i1)} .v2{background:var(--h2);color:var(--i2)} .v3{background:var(--h3);color:var(--i3)} .v4{background:var(--h4);color:var(--i4)} .v5{background:var(--h5);color:var(--i5)}
.rn{box-shadow:inset 0 0 0 1px var(--line);opacity:.55}
.gp{background:var(--warn-soft);color:var(--warn)} .gp2{background:var(--t-tgt);color:#fff}

/* lists */
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:10px 12px;border-radius:8px;background:var(--sunk);min-width:0}
.list li .t{font-weight:500;min-width:0}
.list li .s{grid-column:1/-1;font-size:12px;color:var(--muted)}
.meter{display:inline-flex;gap:2px;vertical-align:middle}
.meter i{width:6px;height:12px;border-radius:1px;background:var(--line)}
.meter i.on{background:var(--h4)}

/* individual */
.people{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px 5px 5px;display:inline-flex;align-items:center;gap:8px;font-weight:500}
.pchip .av{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:600 10px var(--mono);background:var(--sunk)}
.pchip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.pchip[aria-pressed="true"] .av{background:var(--accent);color:var(--accent-ink)}
.pchip .done{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.pchip .done.part{background:var(--warn)}
.addbtn{border:1px dashed var(--line);background:none;border-radius:999px;padding:6px 12px;color:var(--muted)}
.addform{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
input[type=text],select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:8px 14px;font-weight:600}
.btn.ghost{background:var(--sunk);color:var(--ink)}
.btn.danger{background:var(--crit);color:#fff}
.profile{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px}
@media (max-width:860px){.profile{grid-template-columns:1fr}}
.radar svg{width:100%;height:auto;max-width:520px;display:block;margin:0 auto}
.radar text{fill:var(--muted);font:11px var(--body)}
.radar svg{touch-action:none;user-select:none;-webkit-user-select:none}
.radar .axis-hit{cursor:pointer}
.radar .handle{cursor:grab;outline:none}
.radar .handle:active{cursor:grabbing}
.radar .handle .knob{transition:r .12s}
.radar .handle:hover .knob,.radar .handle:focus-visible .knob{r:9}
.radar .handle:focus-visible .knob{stroke:var(--accent);stroke-width:4}
.radar .hval{font:600 11px var(--mono);fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.radar-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;justify-content:center;margin-bottom:6px}
.radar-tools .hint{font-size:12px;max-width:46ch;text-align:center}
.ph{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.ph h2{font-size:24px}

/* rating editor */
.editor{display:grid;gap:18px}
.ecat h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline;padding-bottom:8px;border-bottom:1px solid var(--line);margin-bottom:6px}
.erow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px 16px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.erow:last-child{border-bottom:0}
.erow .nm{min-width:0}
.ehdr{font:500 10.5px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pick{display:inline-flex;gap:3px}
.pick button{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--surface);font:500 12px var(--mono);color:var(--muted);padding:0}
.pick button:hover{border-color:var(--accent)}
.pick.cur button.on{border-color:transparent}
.pick.cur button.on[data-v="1"]{background:var(--h1);color:var(--i1)}
.pick.cur button.on[data-v="2"]{background:var(--h2);color:var(--i2)}
.pick.cur button.on[data-v="3"]{background:var(--h3);color:var(--i3)}
.pick.cur button.on[data-v="4"]{background:var(--h4);color:var(--i4)}
.pick.cur button.on[data-v="5"]{background:var(--h5);color:var(--i5)}
.pick.tgt button.on{background:var(--t-tgt);border-color:transparent;color:#fff}
.pick.rel button{width:auto;padding:0 8px;font:500 11px var(--body)}
.pick.rel button.on[data-v="h"]{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.pick.rel button.on[data-v="c"]{background:var(--sunk);color:var(--ink);border-color:var(--muted)}
.pick.rel button.on[data-v="n"]{background:var(--crit-soft);color:var(--crit);border-color:var(--crit)}
@media (max-width:760px){.erow{grid-template-columns:1fr}.erow .lab{display:none}.erow .pick::before{content:attr(data-l);font:500 10.5px var(--mono);color:var(--muted);text-transform:uppercase;width:54px;align-self:center}}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 20px rgb(0 0 0 / .08);padding-bottom:env(safe-area-inset-bottom,0px)}
.sbin{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding-block:12px}
.sbtn{display:flex;gap:8px}
.av{--hue:220;display:inline-grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;font:600 10.5px var(--mono);background:hsl(var(--hue) 60% var(--av-bg));color:hsl(var(--hue) 55% var(--av-fg))}
.av.lg{width:38px;height:38px;font-size:12.5px}
.av.ext{background:var(--warn-soft);color:var(--warn);font:600 16px var(--body)}
.lead{margin:4px 0 0;max-width:70ch}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:12px;align-items:start}
.mcard{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px;min-width:0}
.pair{display:flex;align-items:center;gap:8px;min-width:0}
.pair b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair .arrow{color:var(--muted);font-weight:600}
.goals{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.goals li{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding-top:6px;border-top:1px solid var(--line)}
.gnum{white-space:nowrap;color:var(--muted)}
.mfoot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);display:grid;gap:4px;font-size:13px}
.mfoot p{margin:0}
.hire{border:2px solid var(--crit);border-radius:var(--r);background:var(--crit-soft);padding:18px;display:grid;gap:14px}
.hire-head{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 24px;align-items:end}
.hire-head p{margin:0;max-width:52ch}
.hire h2{font-size:21px;color:var(--ink)}
.hire-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:10px}
.hcard{background:var(--surface);border-radius:8px;padding:12px;display:grid;gap:6px;align-content:start;border:1px solid var(--line)}
.hcard .chip{justify-self:start}
.hcard .muted{font-size:12px}
.hire-weak{margin:0;font-size:13px}
.core-ov{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:900px){.core-ov{grid-template-columns:1fr}}
.ovwrap svg{width:100%;height:auto;display:block;max-width:600px;margin:0 auto}
.ov .axl{fill:var(--ink);font:500 12px var(--body)}
.ov .tick{fill:var(--muted);font:10px var(--mono)}
.ov .p{fill:var(--pc);fill-opacity:.06;stroke:var(--pc);stroke-width:1.8;stroke-opacity:.9;transition:opacity .15s,stroke-width .15s,fill-opacity .15s}
.ov .p.dim{opacity:.1}
.ov .p.on{fill-opacity:.22;stroke-width:3;opacity:1}
.ov .tavg{fill:none;stroke:var(--ink);stroke-width:2.2;stroke-dasharray:6 4;pointer-events:none}
.ovside{display:grid;gap:16px;min-width:0}
.plegend{display:flex;flex-wrap:wrap;gap:6px}
.plegend button{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px;transition:opacity .15s}
.plegend button i{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.plegend button.off{color:var(--muted);text-decoration:line-through;border-style:dashed}
.plegend button.off i{background:transparent;box-shadow:inset 0 0 0 2px var(--pc)}
.plegend button.dim{opacity:.4}
.plegend .pl-all{color:var(--muted)}
.ctable{border-collapse:collapse;width:100%;font-size:13px}
.ctable th,.ctable td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:right}
.ctable th:first-child{text-align:left;font-weight:500}
.ctable thead th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.chip.new{background:var(--accent-soft);color:var(--accent);font-size:10px;padding:2px 6px;vertical-align:1px}
.chip.core{background:transparent;color:var(--muted);box-shadow:inset 0 0 0 1px var(--line);font-size:10px;padding:2px 6px;vertical-align:1px}
.fwtabs{border-bottom:1px solid var(--line);padding-bottom:6px}
.scalekey{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;font-size:12px}
.scalekey div{padding:8px 10px;border-radius:6px;background:var(--sunk)}
.scalekey b{font-family:var(--mono);margin-right:6px}
details summary{cursor:pointer;font-weight:600}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}
.mentor{display:inline-flex;flex-wrap:wrap;gap:4px}
.confirm{display:inline-flex;gap:6px;align-items:center}
@media (max-width:520px){.cb{grid-template-columns:1fr 46px}.cb .lbl{grid-column:1/-1}.cb .track{grid-column:1}.scale{display:none}}
@media (prefers-reduced-motion:no-preference){.cb .fill{transition:width .35s ease}}
</style>
</head>
<body>


<header class="bar"><div class="wrap">
  <div class="brand"><span class="dot" aria-hidden="true"></span><h1>UXR Capability Map</h1></div>
  <nav class="tabs" role="tablist">
    <button role="tab" data-tab="person" aria-selected="true" id="tab-person">Individual mapping</button>
    <button role="tab" data-tab="team" aria-selected="false" id="tab-team">Team mapping</button>
    <button role="tab" data-tab="plan" aria-selected="false" id="tab-plan">Planning</button>
  </nav>
</div></header>

<main class="wrap">
  <div id="banner" class="banner" hidden></div>
  <section class="view" id="v-person"></section>
  <section class="view" id="v-team" hidden></section>
  <section class="view" id="v-plan" hidden></section>
</main>
<div class="savebar" id="savebar" hidden></div>

<script>
const FW = {"cats": [{"id": "research", "name": "UX Research", "core": true, "group": "Core 8", "skills": [["research1", "Planning and scoping research"], ["research2", "Qualitative methods (interviews, usability testing)"], ["research3", "Quantitative methods (surveys, A/B testing)"], ["research4", "Synthesizing insights & creating personas"], ["research5", "Journey mapping & service blueprinting"], ["res6", "AI-assisted research & synthesis"], ["tools4", "Research tools (Maze, Lookback, Dovetail)"], ["tools5", "Product analytics (Hotjar, GA, Amplitude)"]]}, {"id": "ui", "name": "UI Design", "core": true, "group": "Core 8", "skills": [["ui1", "Layout and composition"], ["ui2", "Visual hierarchy and spacing"], ["ui3", "UI patterns and design systems"], ["ui4", "Branding and visual consistency"], ["ui5", "Figma proficiency"], ["ui6", "Data-dense UI for professional tools"]]}, {"id": "ai", "name": "AI Prototyping", "core": true, "group": "Core 8", "skills": [["ai1", "AI prototyping tools (Figma Make, v0, Lovable, Cursor)"], ["ai2", "Prompting & AI-assisted workflows"], ["ai3", "Code literacy (HTML/CSS, React basics)"], ["ai4", "Designing AI features (agents, trust, explainability)"]]}, {"id": "ixd", "name": "Interaction Design", "core": true, "group": "Core 8", "skills": [["ixd1", "Task flows & user flows"], ["ixd2", "Wireframing & prototyping (low to high fidelity)"], ["ixd3", "Microinteractions & transitions"], ["ixd4", "Accessibility (WCAG compliance)"], ["ixd5", "Desktop, plugin & cross-platform patterns"]]}, {"id": "fac", "name": "Facilitation", "core": true, "group": "Core 8", "skills": [["collab2", "Leading workshops & ideation sessions"], ["fac1", "Running design critiques & reviews"], ["fac2", "Customer co-creation sessions"], ["tools2", "Whiteboarding tools (Miro, FigJam)"]]}, {"id": "pres", "name": "Presenting", "core": true, "group": "Core 8", "skills": [["growth3", "Public speaking / presenting work"], ["pres1", "Research & design storytelling"], ["pres2", "Presenting to leadership"]]}, {"id": "writing", "name": "Writing", "core": true, "group": "Core 8", "skills": [["writing1", "UX writing / microcopy"], ["writing2", "Clear documentation of design decisions"], ["writing3", "Communicating with stakeholders"], ["wr1", "Usability & heuristic evaluation reports"]]}, {"id": "ia", "name": "Information Architecture", "core": true, "group": "Core 8", "skills": [["ia1", "Content organization and labeling"], ["ia2", "Navigation systems"], ["ia3", "Taxonomies and metadata"], ["ia4", "Card sorting & tree testing"]]}, {"id": "collab", "name": "Collaboration & Team", "core": false, "group": "Professional", "skills": [["collab1", "Cross-functional collaboration (PMs, Devs, etc.)"], ["collab3", "Giving and receiving feedback"], ["collab4", "Peer mentoring / supporting juniors"], ["collab5", "Stakeholder management"]]}, {"id": "strategy", "name": "Strategy & Business", "core": false, "group": "Professional", "skills": [["strategy1", "Product thinking"], ["strategy2", "Product management understanding"], ["strategy3", "Aligning UX with business goals"], ["strategy4", "Prioritization & scoping"], ["strategy5", "UX metrics and success criteria"], ["str1", "Domain knowledge: 3D, rendering & AEC workflows"], ["str2", "Competitive analysis"]]}, {"id": "delivery", "name": "Execution & Delivery", "core": false, "group": "Professional", "skills": [["delivery1", "Design handoff to development"], ["delivery2", "Agile teams / design sprints"], ["delivery3", "Jira / Confluence & project tools"], ["delivery4", "QA support and design QA"]]}, {"id": "growth", "name": "Growth & Leadership", "core": false, "group": "Professional", "skills": [["growth1", "Proactiveness in learning & growth"], ["growth2", "Leading initiatives / ownership"], ["growth4", "Coaching / people leadership"], ["growth5", "UX advocacy"]]}], "new": ["res6", "ui6", "ai1", "ai2", "ai3", "ai4", "ixd5", "fac1", "fac2", "pres1", "pres2", "wr1", "str1", "str2"]};
const LEVELS=[["","Not set"],["P1","P1 · Intern / Entry"],["P2","P2 · Developing"],["P3","P3 · Proficiency"],["P4","P4 · Mastering"],["P5","P5 · Expert"],["P6","P6 · Professional (Advisory)"],["P7","P7 · Strategist"],["P8","P8 · Fellow"],["M1","M1 · Team Leader"],["M2","M2 · Manager"],["M3","M3/M4 · Manager / Sr. Manager"],["M5","M4/M5 · Director / Sr. Director"]];
const SCALE=[[1,"Awareness","Aware of it, can't yet perform tasks"],[2,"Novice","Can discuss it and do simple tasks"],[3,"Intermediate","Applies it independently, occasionally"],[4,"Advanced","Coaches others; part of day-to-day work"],[5,"Expert","Consistent excellence across projects"]];
const REL={h:["Focus","High relevance for the role and interest"],c:["Core","Core competency, not a focus in this role"],n:["N/A","Not relevant for role / no interest"]};

// framework helpers
// one skill catalogue; Core 8 = the 8 core areas, each the average of its skills
const CORE=FW.cats.filter(c=>c.core),NEW=new Set(FW.new||[]);
const cats=()=>state.fw==="core"?CORE:FW.cats;
const skillCats=cats;
const allSkills=()=>skillCats().flatMap(c=>c.skills.map(([id,name])=>({id,name,cat:c})));

const state={mentorView:"mentee",mentorFocus:"",fw:"detailed",pfw:"detailed",tab:"person",drafts:{},members:{},sel:null,hmMode:"c",kbAxis:null,adding:false,confirmDel:false,saving:"",db:null,ready:false};
try{const s=JSON.parse(localStorage.getItem("uxr-map-ui")||"{}");Object.assign(state,{mentorView:s.mentorView||"mentee",pfw:s.pfw||"detailed",tab:s.tab||"person",sel:s.sel||null,hmMode:s.hmMode||"c"})}catch(e){}
const persist=()=>{try{localStorage.setItem("uxr-map-ui",JSON.stringify({mentorView:state.mentorView,pfw:state.pfw,tab:state.tab,sel:state.sel,hmMode:state.hmMode}))}catch(e){}};

const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const initials=n=>n.split(/\s+/).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const first=n=>n.split(/\s+/)[0];
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const f1=v=>v==null?"–":v.toFixed(1);
const getM=id=>state.drafts[id]?.member??state.members[id];
const changeCount=patch=>{let n=0;(function w(o){for(const k in o){if(o[k]&&typeof o[k]==="object")w(o[k]);else n++}})(patch);return n};
const roster=()=>Object.entries(state.members).map(([id,m])=>({id,...m})).sort((a,b)=>a.name.localeCompare(b.name));

function entry(m,sid){return m.detailed?.[sid]||{}}
function cur(m,sid){const v=entry(m,sid).c;return v>=1&&v<=5?v:null}
function tgt(m,sid){const v=entry(m,sid).t;return v>=1&&v<=5?v:null}
function rel(m,sid){return entry(m,sid).r||null}
// growth intent: explicit target above current, or (no target) a focus skill at 3 or below
function want(m,sid){const c=cur(m,sid),t=tgt(m,sid);if(c==null)return null;if(t!=null)return t>c?t:null;if(rel(m,sid)==="h"&&c<=3)return 4;return null}
function effT(m,sid){const c=cur(m,sid);return tgt(m,sid)??want(m,sid)??c}
function rated(m){return roster().length&&allSkills().filter(s=>cur(m,s.id)!=null).length}

// team stats per skill
function skillStats(sid){
  const ms=roster(),cs=[],ts=[];let depth=0,experts=0,focus=0,na=0;const learners=[],holders=[];
  for(const m of ms){const c=cur(m,sid);if(c==null)continue;cs.push(c);ts.push(effT(m,sid));
    if(c>=4){depth++;holders.push(m)} if(c===5)experts++;const r=rel(m,sid);if(r==="h")focus++;if(r==="n")na++;
    if(want(m,sid))learners.push(m)}
  const n=cs.length,a=avg(cs),at=avg(ts);
  let status=null;
  if(n){
    if(depth<=1&&(focus>=2||a<3))status={k:"crit",l:depth?"Single expert":"No coverage"};
    else if(a<3.3||depth/n<.3)status={k:"warn",l:"Growth area"};
    else if(a>=4&&depth>=Math.max(2,Math.ceil(n*.5)))status={k:"ok",l:"Strength"};
  }
  const priority=n?(4-a)+learners.length/n+focus/n*.5+(depth<=1?1:0):0;
  return {n,avg:a,avgT:at,depth,experts,focus,na,learners,holders,status,priority};
}
function catAvg(cat,m){const v=cat.skills.map(([id])=>m?cur(m,id):skillStats(id).avg).filter(x=>x!=null);return avg(v)}
function catAvgT(cat,m){const v=cat.skills.map(([id])=>m?effT(m,id):skillStats(id).avgT).filter(x=>x!=null);return avg(v)}

// ---------- rendering ----------
function render(){
  state.fw=state.tab==="person"?state.pfw:"detailed";
  document.querySelectorAll("[data-tab]").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===state.tab));
  for(const t of ["team","person","plan"])$("#v-"+t).hidden=state.tab!==t;
  if(state.needKey){["#v-team","#v-person","#v-plan"].forEach(s=>$(s).innerHTML="");
    $("#v-"+state.tab).innerHTML=`<div class="panel gate"><h2>Enter the team passcode</h2><p class="muted">The UXR team's scores are protected with a shared passcode. Ask the map owner if you don't have it. You only need to enter it once on this device.</p>
      <form id="keyform" class="addform"><input type="password" id="teamkey" aria-label="Team passcode" autocomplete="current-password" required><button class="btn" type="submit">Open the map</button></form>
      ${state.keyError?`<p style="color:var(--crit);margin:10px 0 0">${esc(state.keyError)}</p>`:""}</div>`;
    setTimeout(()=>$("#teamkey")?.focus(),0);renderSavebar();return}
  if(!state.ready){const msg=`<div class="panel empty"><h2>Loading the team's ratings…</h2><p>Scores are kept in the team's Google Sheet. Once it answers, the team map, individual profiles and planning views fill in here.</p></div>`;
    ["#v-team","#v-person","#v-plan"].forEach(s=>$(s).innerHTML=msg);return}
  if(!roster().length){const msg=`<div class="panel empty"><h2>No designers yet</h2><p>Open <b>Individual mapping</b> and choose <b>Add designer</b> to start the map.</p></div>`;
    $("#v-team").innerHTML=msg;$("#v-plan").innerHTML=msg;renderPerson();return}
  if(state.tab==="team")renderTeam();if(state.tab==="person")renderPerson();if(state.tab==="plan")renderPlan();renderSavebar();
}

function heatCls(v){return v==null?"v0":"v"+v}
function meter(v,max=5){let s='<span class="meter" aria-hidden="true">';for(let i=1;i<=max;i++)s+=`<i class="${i<=Math.round(v)?"on":""}"></i>`;return s+"</span>"}

// ---------- Core 8 overlay: every designer on one radar ----------
function coreVal(m,cid,layer){const c=CORE.find(x=>x.id===cid);return layer==="t"?catAvgT(c,m):catAvg(c,m)}
function teamCorePanel(){
  const layer=state.coreLayer||"c",axes=CORE.map(c=>[c.id,c.name]),N=axes.length,W=560,H=440,cx=W/2,cy=H/2,R=160;
  const ms=roster().map((m,i)=>({...m,ci:i%12})).filter(m=>axes.some(([sid])=>coreVal(m,sid,"c")!=null));
  const missing=roster().filter(m=>!ms.some(x=>x.id===m.id));
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+Math.cos(a)*R*v/5,cy+Math.sin(a)*R*v/5]};
  const poly=vals=>vals.map((v,i)=>pt(i,v??0).map(n=>n.toFixed(1)).join(",")).join(" ");
  const hidden=state.coreHidden||{},vis=ms.filter(m=>!hidden[m.id]),focus="";
  let s=`<svg viewBox="0 0 ${W} ${H}" class="ov" role="img" aria-label="Core 8 skills for every designer, overlaid">`;
  for(let k=1;k<=5;k++)s+=`<polygon points="${poly(axes.map(()=>k))}" fill="none" stroke="var(--line)"/>`;
  axes.forEach(([sid,name],i)=>{const [x,y]=pt(i,5);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const [lx,ly]=pt(i,5.55);s+=`<text x="${lx.toFixed(1)}" y="${ly.toFixed(1)}" text-anchor="${Math.abs(lx-cx)<8?"middle":lx>cx?"start":"end"}" dominant-baseline="middle" class="axl">${esc(name)}</text>`});
  for(let k=1;k<=5;k++){const [x,y]=pt(0,k);s+=`<text x="${x+5}" y="${y}" dominant-baseline="middle" class="tick">${k}</text>`}
  for(const m of vis){const v=axes.map(([sid])=>coreVal(m,sid,layer));
    s+=`<polygon class="p ${focus&&focus!==m.id?"dim":""} ${focus===m.id?"on":""}" data-id="${m.id}" points="${poly(v)}" style="--pc:var(--p${m.ci})"><title>${esc(m.name)}</title></polygon>`}
  const tavg=axes.map(([sid])=>avg(vis.map(m=>coreVal(m,sid,layer)).filter(x=>x!=null)));
  s+=`<polygon class="tavg" points="${poly(tavg)}"/>`+"</svg>";
  const rows=axes.map(([sid,name],i)=>{const vals=vis.map(m=>coreVal(m,sid,"c")).filter(x=>x!=null),tv=vis.map(m=>coreVal(m,sid,"t")).filter(x=>x!=null);
    return `<tr><th>${esc(name)}</th><td class="num">${f1(avg(vals))}</td><td class="num muted">${f1(avg(tv))}</td><td class="num muted">${vals.length?f1(Math.min(...vals))+"–"+f1(Math.max(...vals)):"–"}</td><td class="num muted">${vals.length}/${vis.length}</td></tr>`}).join("");
  return `<div class="panel"><div class="phead"><div><h2>Core 8 · whole team</h2><p class="muted lead">Every designer's shape on one map. Each axis is the average of that area's skills in the full skillset. Hover a name to highlight it, click a name to take that person off the map. The dark dashed line is the average of the people shown.</p></div>
    <div class="seg" role="group" aria-label="Show"><button data-clayer="c" aria-pressed="${layer==="c"}">Today</button><button data-clayer="t" aria-pressed="${layer==="t"}">Target</button></div></div>
    <div class="core-ov"><div class="ovwrap">${s}</div>
      <div class="ovside"><div class="plegend" role="group" aria-label="Designers">${ms.map(m=>`<button data-cfocus="${m.id}" aria-pressed="${!hidden[m.id]}" class="${hidden[m.id]?"off":""}" style="--pc:var(--p${m.ci})" title="${hidden[m.id]?"Add to map":"Remove from map"}"><i></i>${esc(m.name)}</button>`).join("")}
        ${Object.values(hidden).some(Boolean)?`<button data-cfocus="" class="pl-all">Show everyone</button>`:""}</div>
        <table class="ctable"><thead><tr><th>Skill</th><th>Avg</th><th>Target</th><th>Range</th><th>People</th></tr></thead><tbody>${rows}</tbody></table>
        ${missing.length?`<p class="muted" style="font-size:12px;margin:0">Not rated yet: ${missing.map(m=>esc(first(m.name))).join(", ")}</p>`:""}</div></div></div>`;
}
function hlCore(id){const root=$(".core-ov");if(!root)return;
  root.querySelectorAll(".p").forEach(p=>{p.classList.toggle("dim",!!id&&p.dataset.id!==id);p.classList.toggle("on",p.dataset.id===id)});
  root.querySelectorAll("[data-cfocus]").forEach(b=>b.classList.toggle("dim",!!id&&b.dataset.cfocus!==id&&b.dataset.cfocus!==""&&!b.classList.contains("off")))}
document.addEventListener("pointerover",e=>{const el=e.target.closest?.(".core-ov .p,.core-ov [data-cfocus]");if(el)hlCore(el.dataset.id??el.dataset.cfocus)});
document.addEventListener("pointerout",e=>{const el=e.target.closest?.(".core-ov .p,.core-ov [data-cfocus]");if(el&&!el.contains(e.relatedTarget))hlCore("")});
function renderTeam(){
  const ms=roster(),sk=allSkills(),stats=Object.fromEntries(sk.map(s=>[s.id,skillStats(s.id)]));
  const ratedN=ms.filter(m=>sk.some(s=>cur(m,s.id)!=null)).length;
  const teamAvg=avg(sk.map(s=>stats[s.id].avg).filter(x=>x!=null));
  const strengths=sk.filter(s=>stats[s.id].status?.k==="ok").sort((a,b)=>stats[b.id].avg-stats[a.id].avg);
  const growth=sk.filter(s=>["warn","crit"].includes(stats[s.id].status?.k)).sort((a,b)=>stats[b.id].priority-stats[a.id].priority);
  const crit=sk.filter(s=>stats[s.id].status?.k==="crit");
  const sc=skillCats();
  let h=`<div class="stats">
    <div class="stat"><span class="eyebrow">Designers rated</span><b>${ratedN}<span class="muted" style="font-size:15px"> / ${ms.length}</span></b></div>
    <div class="stat"><span class="eyebrow">Team average</span><b>${f1(teamAvg)}</b><small>on the 1–5 scale</small></div>
    <div class="stat"><span class="eyebrow">Strengths</span><b style="color:var(--ok)">${strengths.length}</b><small>skills with deep bench</small></div>
    <div class="stat"><span class="eyebrow">Growth areas</span><b style="color:var(--warn)">${growth.length}</b><small>low average or thin bench</small></div>
    <div class="stat"><span class="eyebrow">Coverage risks</span><b style="color:var(--crit)">${crit.length}</b><small>0–1 people at Advanced+</small></div>
  </div>`;
  h+=teamCorePanel();
  // category bars
  h+=`<div class="panel"><div class="phead"><h2>Capability areas</h2>
    <div class="legend"><span><i style="background:var(--h4)"></i>Team average today</span><span><i style="background:var(--t-tgt)"></i>Where the team wants to be</span></div></div>
    <div class="catbars">${cats().map(c=>{const a=catAvg(c),t=catAvgT(c);return `<div class="cb"><span class="lbl" title="${esc(c.name)}">${esc(c.name)}${c.core?' <span class="chip core">Core</span>':""}</span>
      <div class="track" role="img" aria-label="${esc(c.name)}: ${f1(a)} now, ${f1(t)} target"><div class="fill" style="width:${a?((a-0)/5*100):0}%"></div>${t?`<div class="tgt" style="left:calc(${t/5*100}% - 1.5px)"></div>`:""}</div>
      <span class="num">${f1(a)} <span class="muted">→ ${f1(t)}</span></span></div>`}).join("")}</div>
    <div class="scale" aria-hidden="true"><span>0</span><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span></div></div>`;
  // strengths & growth
  const li=(s,kind)=>{const st=stats[s.id];return `<li><span class="t">${esc(s.name)}</span><span class="chip ${st.status.k}">${st.status.l}</span>
    <span class="s">${state.fw==="core"?"":esc(s.cat.name)+" · "}avg <span class="num">${f1(st.avg)}</span> · ${st.depth} at Advanced+ · ${st.learners.length} want to grow${kind==="ok"&&st.holders.length?" · go-to: "+st.holders.slice(0,4).map(m=>esc(first(m.name))).join(", "):""}</span></li>`};
  h+=`<div class="grid2">
    <div class="panel"><div class="phead"><h2>Team strengths</h2><span class="muted">avg ≥ 4 and at least half the team at Advanced+</span></div>
      ${strengths.length?`<ul class="list">${strengths.slice(0,8).map(s=>li(s,"ok")).join("")}</ul>`:`<p class="muted">No skill clears the bar yet.</p>`}</div>
    <div class="panel"><div class="phead"><h2>Growth areas</h2><span class="muted">ranked by gap, demand and bench depth</span></div>
      ${growth.length?`<ul class="list">${growth.slice(0,8).map(s=>li(s,"warn")).join("")}</ul>`:`<p class="muted">No growth areas flagged.</p>`}</div>
  </div>`;
  // heatmap
  const modes=[["c","Current"],["t","Target"],["g","Growth gap"]];
  h+=`<div class="panel"><div class="phead"><h2>Team skill map</h2>
    <div class="seg" role="group" aria-label="Map shows">${modes.map(([k,l])=>`<button data-hm="${k}" aria-pressed="${state.hmMode===k}">${l}</button>`).join("")}</div></div>
    <div class="legend" style="margin-bottom:10px">${state.hmMode==="g"?`<span><i class="gp"></i>+1 wanted</span><span><i class="gp2"></i>+2 or more wanted</span><span>Targets left empty are inferred as 4 for Focus skills rated 3 or lower</span>`
      :SCALE.map(([v,l])=>`<span><i class="v${v}"></i>${v} ${l}</span>`).join("")+(state.fw==="detailed"?`<span><i class="v3 rn"></i>Marked N/A for role</span>`:"")}</div>
    <div class="hm-wrap"><table class="hm"><thead><tr><th class="sk">Skill</th>${ms.map(m=>`<th class="person" data-person="${m.id}" title="${esc(m.name)}"><span>${esc(initials(m.name))}</span></th>`).join("")}
      <th class="agg">Avg</th><th class="agg">4+</th><th class="st" style="text-align:left">Signal</th></tr></thead><tbody>`;
  for(const c of sc){
    if(state.fw!=="core")h+=`<tr class="cat"><td colspan="${ms.length+4}">${esc(c.name)} <span class="muted num">· ${f1(catAvg(c))}</span>${c.core?' <span class="chip core">Core 8</span>':""}</td></tr>`;
    for(const [sid,name] of c.skills){const st=stats[sid];
      h+=`<tr><th class="sk" scope="row">${esc(name)}</th>${ms.map(m=>{const cv=cur(m,sid),r=rel(m,sid);let v,cls,tt;
        if(state.hmMode==="g"){const w=want(m,sid);v=w&&cv?w-cv:null;cls=v==null?"v0":v>=2?"gp2":"gp";tt=v?`wants +${v}`:"";v=v?"+"+v:"";}
        else{v=state.hmMode==="t"?(tgt(m,sid)??null):cv;cls=heatCls(v)+(r==="n"&&state.hmMode==="c"?" rn":"");tt=v??"";v=v??"·"}
        return `<td class="c ${cls}" title="${esc(m.name)} · ${esc(name)}${tt!==""?": "+tt:""}${r?" · "+REL[r][0]:""}">${v}</td>`}).join("")}
        <td class="agg">${f1(state.hmMode==="t"?st.avgT:st.avg)}</td><td class="agg">${st.depth}</td><td class="st">${st.status?`<span class="chip ${st.status.k}">${st.status.l}</span>`:""}</td></tr>`}
  }
  h+=`</tbody></table></div><p class="muted" style="margin:10px 0 0;font-size:12px">Select a person's initials to open their profile.${state.hmMode==="t"?" Empty cells mean no target set yet.":""}</p></div>`;
  $("#v-team").innerHTML=h;
}

// radar chart
function radar(m){
  const cs=cats(),N=cs.length,W=520,H=400,cx=W/2,cy=H/2+4,R=140;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+Math.cos(a)*R*v/5,cy+Math.sin(a)*R*v/5]};
  const poly=vals=>vals.map((v,i)=>pt(i,v??0).map(n=>n.toFixed(1)).join(",")).join(" ");
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Radar of ${esc(m.name)}'s scores by area">`;
  for(let k=1;k<=5;k++)s+=`<polygon points="${poly(cs.map(()=>k))}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  cs.forEach((c,i)=>{const [x,y]=pt(i,5);s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const [lx,ly]=pt(i,5.9);const anchor=Math.abs(lx-cx)<8?"middle":lx>cx?"start":"end";
    const words=c.name.replace(" & "," & ").split(" ");const lines=[];let cur="";for(const w of words){if((cur+" "+w).trim().length>16&&cur){lines.push(cur);cur=w}else cur=(cur+" "+w).trim()}lines.push(cur);

function commitAxis(i,v){

  const m=getM(state.sel),c=cats()[i],branch="detailed",key="c";
  const mm={id:state.sel,...m};

}

const MAX_LOAD=3;
function growthGoals(m,stats){
  return allSkills().filter(s=>want(m,s.id)).sort((a,b)=>
    (want(m,b.id)-cur(m,b.id))-(want(m,a.id)-cur(m,a.id))||(rel(m,b.id)==="h")-(rel(m,a.id)==="h")||(stats[a.id].avg??5)-(stats[b.id].avg??5)).slice(0,2);
}
function computeMentoring(){
  const ms=roster(),sk=allSkills(),stats=Object.fromEntries(sk.map(s=>[s.id,skillStats(s.id)]));
  const goals=[];
  for(const m of ms)for(const s of growthGoals(m,stats)){
    const to=want(m,s.id),cands=ms.filter(p=>p.id!==m.id&&cur(p,s.id)!=null&&cur(p,s.id)>=Math.max(4,to));
    goals.push({mentee:m,skill:s,from:cur(m,s.id),to,cands});
  }
  // place the hardest-to-match goals first so scarce experts go where they're needed
  goals.sort((a,b)=>a.cands.length-b.cands.length);
  const load={},pairsOf={};
  for(const g of goals){
    if(!g.cands.length){g.mentor=null;g.alts=[];continue}
    const already=pairsOf[g.mentee.id]||new Set();
    const ranked=[...g.cands].sort((a,b)=>(already.has(b.id)-already.has(a.id))||((load[a.id]||0)>=MAX_LOAD)-((load[b.id]||0)>=MAX_LOAD)||(load[a.id]||0)-(load[b.id]||0)||cur(b,g.skill.id)-cur(a,g.skill.id));
    g.mentor=ranked[0];g.alts=ranked.slice(1,3);
    load[g.mentor.id]=(load[g.mentor.id]||0)+(already.has(g.mentor.id)?0:1);
    (pairsOf[g.mentee.id]=already).add(g.mentor.id);
  }
  // group into pairs: one card per mentee+mentor
  const pairs={};
  for(const g of goals){const k=g.mentee.id+"|"+(g.mentor?.id||"ext");(pairs[k]=pairs[k]||{mentee:g.mentee,mentor:g.mentor,goals:[]}).goals.push(g)}
  const list=Object.values(pairs).sort((a,b)=>(!a.mentor)-(!b.mentor)||a.mentee.name.localeCompare(b.mentee.name));
  const noGoals=ms.filter(m=>!goals.some(g=>g.mentee.id===m.id));
  return {goals,pairs:list,load,noGoals};
}

    ${risks.length?`<div class="hire-grid">${risks.slice(0,8).map(s=>{const st=stats[s.id];return `<div class="hcard ${st.depth?"single":"none"}">
      <span class="chip ${st.depth?"warn":"crit"}">${st.depth?"Single expert":"No coverage"}</span><b>${esc(s.name)}</b>
      <span class="muted">${esc(s.cat.name)} · team avg ${f1(st.avg)}${st.depth?` · only ${esc(first(st.holders[0].name))}`:""}</span></div>`}).join("")}</div>`:""}
    <p class="hire-weak"><b>Weakest areas:</b> ${weakCats.map(x=>`${esc(x.c.name)} <span class="num">${f1(x.a)}</span>`).join(" · ")}</p></div>`;
  h+=mentoringPanel();
  h+=`<div class="panel"><div class="phead"><h2>Development programs</h2><span class="muted">where 2+ people want to grow</span></div>
      ${demand.length?`<ul class="list">${demand.map(({s,st})=>{const coaches=st.holders.filter(h=>cur(h,s.id)>=4).sort((a,b)=>cur(b,s.id)-cur(a,s.id));return `<li><span class="t">${esc(s.name)}</span><span class="chip plain">${st.learners.length} learners</span>
        <span class="s">Learners: ${st.learners.map(m=>esc(first(m.name))).join(", ")} · ${coaches.length?"Coaches: "+coaches.slice(0,4).map(m=>esc(first(m.name))).join(", "):"No internal coach: external training"}</span></li>`}).join("")}</ul>`:`<p class="muted">Not enough growth targets yet. Ask the team to set targets in Individual mapping.</p>`}</div>`;
  // levels
  h+=`<div class="panel"><div class="phead"><h2>Career levels</h2><span class="muted">set in each profile · P-track individual contributors, M-track managers</span></div>
    <ul class="list">${LEVELS.filter(([v])=>lv[v]).map(([v,l])=>`<li><span class="t">${v?esc(l):"Level not set"}</span><span class="num">${lv[v].length}</span><span class="s">${lv[v].map(m=>esc(m.name)).join(", ")}</span></li>`).join("")}</ul></div>`;
  $("#v-plan").innerHTML=h;
}

// ---------- writes ----------
function stage(id,patch){
  const d=state.drafts[id]=state.drafts[id]||{member:structuredClone(state.members[id]),patch:{}};
  deepMerge(d.member,structuredClone(patch));deepMerge(d.patch,structuredClone(patch));
  state.saving="";const y=window.scrollY;renderPerson();window.scrollTo({top:y});renderSavebar();
}
function renderSavebar(){
  const bar=$("#savebar"),d=state.tab==="person"&&state.sel&&state.drafts[state.sel];
  if(!d){bar.hidden=!state.saving||state.tab!=="person";bar.innerHTML=state.saving?`<div class="wrap sbin"><span>${esc(state.saving)}</span></div>`:"";return}
  const n=changeCount(d.patch),nm=first(state.members[state.sel]?.name||"");
  bar.hidden=false;bar.innerHTML=`<div class="wrap sbin"><span><b>${n} unsaved ${n===1?"change":"changes"}</b> to ${esc(nm)}'s map</span>
    <span class="sbtn"><button class="btn ghost" data-act="discard">Discard</button><button class="btn" data-act="confirm">Confirm changes</button></span></div>`;
}
async function confirmDraft(){
  const id=state.sel,d=state.drafts[id];if(!d||!state.db)return;
  state.saving="Saving…";renderSavebar();
  try{await state.db.doc("members/"+id).update({...d.patch,updatedAt:new Date().toISOString().slice(0,10)});
    if(state.drafts[id]===d)delete state.drafts[id];state.saving="Saved";}
  catch(e){state.saving=e?.code==="unauthorized"?"The team passcode was rejected. Reload the page and enter the current one.":"Couldn't save. Check your connection and confirm again.";}
  render();setTimeout(()=>{if(state.saving==="Saved"){state.saving="";renderSavebar()}},2500);
}
function deepMerge(a,b){for(const k in b){if(b[k]&&typeof b[k]==="object"&&!Array.isArray(b[k])){a[k]=a[k]||{};deepMerge(a[k],b[k])}else a[k]=b[k]}return a}

document.addEventListener("click",async e=>{
  const t=e.target.closest("button,th[data-person]");if(!t)return;const act0=t.dataset.act;
  if(t.dataset.pfw){state.pfw=t.dataset.pfw;persist();const y=window.scrollY;render();window.scrollTo({top:y});return}
  if(t.dataset.tab){state.tab=t.dataset.tab;state.confirmDel=false;persist();render();return}
  if(t.dataset.hm){state.hmMode=t.dataset.hm;persist();render();return}
  if(t.dataset.clayer){state.coreLayer=t.dataset.clayer;const y=window.scrollY;render();window.scrollTo({top:y});return}
  if(t.dataset.cfocus!==undefined){const id=t.dataset.cfocus;state.coreHidden=id?{...state.coreHidden,[id]:!state.coreHidden?.[id]}:{};const y=window.scrollY;render();window.scrollTo({top:y});return}
  if(t.dataset.mview){state.mentorView=t.dataset.mview;persist();const y=window.scrollY;render();window.scrollTo({top:y});return}
  if(act0==="confirm"){confirmDraft();return}
  if(act0==="discard"){delete state.drafts[state.sel];state.saving="";const y=window.scrollY;render();window.scrollTo({top:y});return}
  if(t.dataset.person){state.sel=t.dataset.person;state.tab="person";state.confirmDel=false;persist();render();window.scrollTo({top:0});return}
  const act=t.dataset.act;
  if(act==="add"){state.adding=true;render();return}
  if(act==="cancel-add"){state.adding=false;render();return}
  if(act==="del"){state.confirmDel=true;render();return}
  if(act==="del-no"){state.confirmDel=false;render();return}
  if(act==="del-yes"&&state.db){const id=state.sel;state.confirmDel=false;try{await state.db.doc("members/"+id).delete();state.sel=null;}catch(err){showBanner("Couldn't remove this designer. Check your connection and try again.")}render();return}
  if(t.dataset.set&&state.sel&&state.db){
    const kind=t.dataset.set,sid=t.dataset.sid,raw=t.dataset.v,key={cur:"c",tgt:"t",rel:"r"}[kind];
    const v=kind==="rel"?raw:+raw;const m=getM(state.sel);const branch="detailed";
    const old=m[branch]?.[sid]?.[key];const nv=old===v?null:v;
    stage(state.sel,{[branch]:{[sid]:{[key]:nv}}});
  }
});
document.addEventListener("change",e=>{
  
  if(e.target.id==="level"&&state.sel&&state.db){stage(state.sel,{level:e.target.value})}
});
document.addEventListener("submit",async e=>{
  if(e.target.id==="keyform"){e.preventDefault();const k=$("#teamkey").value.trim();if(k){state.keyError="";connect(k)}return}
  if(e.target.id!=="addform")return;e.preventDefault();
  const name=$("#newname").value.trim().replace(/\s+/g," ");if(!name||!state.db)return;
  let id=name.toLowerCase().normalize("NFKD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"designer";
  while(state.members[id])id+="-2";
  try{await state.db.doc("members/"+id).set({name,level:"",detailed:{},core:{},updatedAt:new Date().toISOString().slice(0,10)});state.sel=id;state.adding=false;persist();}
  catch(err){showBanner(err?.code==="quota_exceeded"?"The team store is full. Remove someone before adding more.":"Couldn't add this designer. Check your connection and try again.")}
  render();
});
function showBanner(t){const b=$("#banner");b.textContent=t;b.hidden=false}

// ---------- shared store: Google Sheets via Apps Script ----------
// Paste the web app URL from Deploy > Manage deployments (ends in /exec).
const API_URL="https://script.google.com/macros/s/AKfycbzCuLqUsREqBchwdp-xKVgUHdrqYurTOoRzKhsL7wNIudqRsV3aF3KeecTBVuTB72nEUQ/exec";

function sheetDb(url,key){
  const listeners=new Set();let cache={},timer=null,last="";
  const emit=()=>{const snap={docs:Object.entries(cache).map(([id,d])=>({id,exists:true,data:()=>d}))};listeners.forEach(l=>l.next(snap))};
  async function load(){
    let r;try{r=await fetch(url+"?key="+encodeURIComponent(key)+"&t="+Date.now())}catch(e){throw {code:"unavailable"}}
    const j=await r.json().catch(()=>({ok:false,error:"unavailable"}));
    if(!j.ok)throw {code:j.error==="unauthorized"?"unauthorized":"unavailable"};return j.docs}
  async function refresh(){try{const docs=await load();const sig=JSON.stringify(docs);if(sig===last)return;last=sig;cache=Object.fromEntries(docs.map(d=>[d.id,d.data]));emit()}catch(e){listeners.forEach(l=>l.err&&l.err(e))}}
  async function post(body,apply){
    let r;try{r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({...body,key})})}catch(e){throw {code:"unavailable"}}
    const j=await r.json().catch(()=>({ok:false,error:"unavailable"}));
    if(!j.ok)throw {code:j.error==="unauthorized"?"unauthorized":"unavailable"};
    apply();last="";emit();setTimeout(refresh,800);
  }
  return {load,
    collection:()=>({onSnapshot(next,err){const l={next,err};listeners.add(l);refresh();
      if(!timer){timer=setInterval(()=>{if(!document.hidden)refresh()},POLL_MS);document.addEventListener("visibilitychange",()=>{if(!document.hidden)refresh()})}
      return()=>listeners.delete(l)}}),
    doc:path=>{const id=path.split("/")[1];return{
      update:patch=>post({action:"update",id,patch},()=>{if(cache[id])cache[id]=deepMerge(structuredClone(cache[id]),structuredClone(patch))}),
      set:data=>post({action:"set",id,data},()=>{cache[id]=structuredClone(data)}),
      delete:()=>post({action:"delete",id},()=>{delete cache[id]})}}};
}
async function connect(key){
  const db=sheetDb(API_URL,key);
  try{await db.load()}catch(e){
    state.needKey=true;state.keyError=e.code==="unauthorized"?"That passcode didn't work. Check it with the map owner.":"Couldn't reach the score store. Check your connection and try again.";
    if(e.code==="unauthorized"){try{localStorage.removeItem("uxr-map-key")}catch(_){}}
    render();return}
  try{localStorage.setItem("uxr-map-key",key)}catch(e){}
  state.needKey=false;state.keyError="";state.db=db;
  db.collection("members").onSnapshot(snap=>{
    $("#banner").hidden=true;
    const next={};snap.docs.forEach(d=>{const x=d.data();if(x&&x.name)next[d.id]=x});
    for(const id in state.drafts){if(next[id])state.drafts[id].member=deepMerge(structuredClone(next[id]),structuredClone(state.drafts[id].patch));else delete state.drafts[id]}
    state.members=next;state.ready=true;
    if(drag)return;
    const active=document.activeElement;if(active&&(active.id==="newname"||active.closest?.("#editor-skip")))return;
    const y=window.scrollY;render();window.scrollTo({top:y});
  },err=>{
    if(err.code==="unauthorized"){try{localStorage.removeItem("uxr-map-key")}catch(_){}state.needKey=true;state.keyError="The team passcode has changed. Enter the new one.";state.db=null;render();return}
    showBanner("Can't reach the score store right now. Retrying automatically.");
  });
}
render();
(async()=>{
  if(!/^https:\/\/script\.google\.com\//.test(API_URL)){state.ready=true;showBanner("Setup needed: paste the Apps Script web app URL into API_URL in this file (see the README).");render();return}
  let key="";try{key=localStorage.getItem("uxr-map-key")||""}catch(e){}
  if(!key){state.needKey=true;render();return}
  connect(key);
})();
</script>
