<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chaos AI Assistant — Light management prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fg:#3b3b3b; --fg-muted:#7a7a7d; --line:#e6e6e6; --bg:#ffffff; --bg-soft:#f4f4f4;
  --primary:#0b6aa2; --primary-hover:#09598a; --send:#1a9ddb;
  --info-mild:#f4fbff; --info-subtle:#e2f2fc; --info-border:#6cbbe8; --info-text:#1a9ddb;
  --pink:#ff3380; --shadow:0 12px 40px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;color:var(--fg);background:#d9d9db;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
svg{display:block}

/* ---------- prototype chrome ---------- */
.proto-bar{height:52px;display:flex;align-items:center;gap:16px;padding:0 16px;background:#1f1f22;color:#fff;font-size:13px}
.proto-bar b{font-weight:600}
.step{display:flex;align-items:center;gap:8px;background:#2e2e33;border-radius:999px;padding:6px 12px 6px 6px}
.step .num{background:var(--pink);color:#fff;border-radius:999px;font-weight:700;font-size:12px;min-width:28px;height:22px;display:grid;place-items:center;padding:0 6px}
.proto-bar .spacer{flex:1}
.toggle{display:flex;align-items:center;gap:8px;user-select:none;cursor:pointer}
.toggle input{display:none}
.toggle .sw{width:30px;height:18px;border-radius:9px;background:#55555c;position:relative;transition:.2s}
.toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.toggle input:checked + .sw{background:var(--pink)}
.toggle input:checked + .sw::after{left:14px}
.pbtn{background:#3a3a40;color:#fff;border:0;border-radius:6px;padding:7px 12px;font-size:13px}
.pbtn:hover{background:#4a4a52}
.hint{color:#a9a9b0}

/* ---------- app ---------- */
.app{position:absolute;top:52px;left:0;right:0;bottom:0;display:flex;flex-direction:column;min-width:1100px;background:#fff;overflow:hidden}
.toolbar{height:40px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 8px;gap:2px;background:#fff}
.tb{width:32px;height:32px;border-radius:6px;display:grid;place-items:center;color:#4a4a4a}
.tb.home{background:#0b6aa2;color:#fff;width:28px;height:28px;border-radius:6px;margin-right:6px}
.tb.sep{width:1px;height:22px;background:var(--line);margin:0 6px;border-radius:0}
.tb.ai{color:#1a9ddb}
.body{position:relative;flex:1;display:flex;min-height:0}

/* side panel */
.panel{width:336px;flex:none;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:2;box-shadow:4px 0 16px rgba(0,0,0,.04)}
.panel-head{height:56px;display:flex;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);gap:8px}
.panel-head h1{font-size:16px;font-weight:600;margin:0;color:#3b3b3b}
.icon-btn{border:0;background:transparent;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:#4a4a4a}
.icon-btn:hover{background:#f0f0f0}
.ai-btn{width:24px;height:24px;border-radius:4px;border:0;background:var(--primary);color:#fff;display:grid;place-items:center;transition:background .12s, box-shadow .12s;position:relative}
.ai-btn:hover{background:var(--primary-hover)}
.ai-btn.selected{background:#063f62;box-shadow:0 0 0 2px #fff, 0 0 0 4px #6cbbe8}
.panel-body{padding:12px;display:flex;flex-direction:column;gap:12px;overflow:auto}
.row{display:flex;align-items:center;gap:8px}
.preset{background:var(--info-subtle);color:#1a8ccc;border-radius:4px;font-weight:500;font-size:12px;padding:6px 8px;display:flex;gap:6px;align-items:center}
.dots{width:24px;height:24px;border:1px solid #c9c9c9;border-radius:4px;display:grid;place-items:center;font-weight:700;font-size:11px}
.count{font-size:12px;font-weight:600}
.search{flex:1;background:var(--bg-soft);border-radius:4px;height:28px;display:flex;align-items:center;gap:6px;padding:0 8px;font-size:12px;color:#7a7a7d}
.lights{border-top:1px solid var(--line);padding-top:6px;display:flex;flex-direction:column}
.light{display:flex;align-items:center;gap:10px;font-size:12px;height:32px;padding:0 4px;border-radius:4px;transition:background .3s}
.light:hover{background:#f6f6f6}
.light .st{margin-left:auto;font-size:10px;color:#c0841a;opacity:0;transition:opacity .4s}
.light.changed{background:#fff7e8}
.light.changed .st{opacity:1}

/* viewport */
.viewport{position:relative;flex:1;overflow:hidden;background:#9fc3e6}
.scene{position:absolute;inset:0;transition:filter 1.2s ease}
.scene svg{width:100%;height:100%}
.scene .sky-eve,.scene .win-glow,.scene .eve-overlay{transition:opacity 1.4s ease}
.scene .sky-eve,.scene .win-glow{opacity:0}
.scene .sun{transition:transform 1.6s ease, fill 1.4s}
.eve-overlay{position:absolute;inset:0;pointer-events:none;opacity:0;mix-blend-mode:multiply;background:linear-gradient(180deg,#1c2259 0%,#99493f 55%,#ff9a40 100%)}
.scene.evening .sky-eve,.scene.evening .win-glow{opacity:1}
.scene.evening .sun{transform:translate(-260px,300px);fill:#ff9b45}
.scene.evening + .eve-overlay{opacity:.55}
.scene.dim{filter:brightness(.7) saturate(.85)}
.scene.lightsoff .win-glow{opacity:0 !important}
.vp-label{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font-size:11px;padding:4px 8px;border-radius:4px;transition:opacity .3s}

/* tooltip */
.tooltip{position:absolute;background:#fff;color:#3b3b3b;font-size:12px;padding:8px 10px;border-radius:4px;box-shadow:0 2px 10px rgba(0,0,0,.18);white-space:nowrap;z-index:30;opacity:0;transform:translateY(-3px);transition:opacity .12s, transform .12s;pointer-events:none}
.tooltip.show{opacity:1;transform:none}

/* window (shared) */
.win{position:absolute;background:#fff;border-radius:6px;box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:20;overflow:hidden;transform-origin:top left;animation:pop .16s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(-4px)}to{opacity:1;transform:none}}
.win-head{height:44px;flex:none;display:flex;align-items:center;padding:0 8px 0 12px;border-bottom:1px solid var(--line);gap:6px;cursor:default}
.win.min .win-head{border-bottom:0;cursor:pointer}
.win.min .win-head:hover{background:#fafafa}
.win-head .ttl{display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;flex:1}
.win-body{flex:1;display:flex;flex-direction:column;gap:12px;padding:12px;min-height:0}
.win.min .win-body{display:none}
.ctx{font-size:12px;font-weight:600}
.cards{display:flex;flex-direction:column;gap:6px}
.card{border:1px solid transparent;background:var(--info-mild);border-radius:6px;min-height:32px;padding:8px;font-size:12px;text-align:left;color:var(--fg);transition:background .1s,border-color .1s}
.card:hover{background:var(--info-subtle);border-color:var(--info-border)}
.card:active{transform:translateY(1px)}
.card.picked{background:var(--info-subtle);border-color:var(--info-border)}
.send.nudge{animation:nudge .5s ease}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(26,157,219,0)}40%{box-shadow:0 0 0 5px rgba(26,157,219,.35)}}

/* input */
.input{position:relative;border-radius:6px;padding:1px;background:linear-gradient(135deg,#3fd2f2,#8f5cf6 70%,#c35cf6)}
.input-in{background:#f4f4f4;border-radius:5px;display:flex;gap:8px;padding:8px}
.input textarea{flex:1;border:0;background:transparent;resize:none;font:inherit;font-size:12px;line-height:18px;color:var(--fg);outline:none;min-height:52px;max-height:120px}
.input textarea::placeholder{color:#8c8c8f}
.input textarea:disabled{cursor:not-allowed}
.input .tools{display:flex;flex-direction:column;gap:6px;justify-content:flex-end}
.sq{width:28px;height:28px;border-radius:4px;border:1px solid #c9c9c9;background:#fff;color:#4a4a4a;display:grid;place-items:center}
.sq:hover{background:#f2f2f2}
.send{width:32px;height:32px;border-radius:4px;border:0;background:var(--send);color:#fff;display:grid;place-items:center;transition:background .12s}
.send:hover{background:#1689c0}
.send:disabled{background:#a9a9ad;cursor:not-allowed}
.send.stop{background:#085a8a}
.mini .input textarea{min-height:52px}

/* full window */
.full .win-body{gap:12px}
.chat-bar{display:flex;align-items:center;gap:8px}
.newbtn{border:1px solid #c9c9c9;background:#fff;border-radius:4px;height:28px;padding:0 10px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px;color:#3b3b3b}
.newbtn:hover{background:#f2f2f2}
.convo{flex:1;overflow:auto;display:flex;flex-direction:column;gap:16px;padding-right:2px;scroll-behavior:smooth}
.msg-user{align-self:flex-end;max-width:85%;background:var(--info-mild);border-radius:6px;padding:8px 12px;font-size:12px;line-height:18px;animation:fade .2s}
.msg-ai{display:flex;flex-direction:column;gap:8px;font-size:12px;line-height:18px;animation:fade .25s}
.msg-ai h4{margin:0;font-size:12px;font-weight:600}
.msg-ai ul{margin:0;padding-left:16px}
.msg-ai .muted{color:var(--fg-muted);font-size:11px;line-height:17px}
.steps{list-style:none;padding:0 !important;margin:0;color:var(--fg-muted);font-size:11px;line-height:17px}
.steps li{display:flex;gap:6px;align-items:center}
.spin{width:10px;height:10px;border:1.5px solid #c4c4c8;border-top-color:var(--send);border-radius:50%;animation:spin .7s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.actions{display:flex;gap:8px}
.btn{height:28px;padding:0 12px;border-radius:4px;font-size:12px;font-weight:600;border:1px solid transparent}
.btn.sec{background:#fff;border-color:#c9c9c9;color:#3b3b3b}
.btn.sec:hover{background:#f2f2f2}
.btn.pri{background:var(--primary);color:#fff}
.btn.pri:hover{background:var(--primary-hover)}
.status{font-size:11px;color:var(--fg-muted);display:flex;align-items:center;gap:6px}
.empty{display:flex;flex-direction:column;gap:10px}
.history{position:absolute;top:84px;left:12px;width:240px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.12);padding:6px;z-index:5;font-size:12px}
.history div{padding:6px 8px;border-radius:4px}
.history div:hover{background:#f4f4f4}
.history .h{font-weight:600;color:var(--fg-muted);font-size:11px}
.toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);background:#2b2b2f;color:#fff;font-size:12px;padding:8px 12px;border-radius:6px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:50}
.toast.show{opacity:1}

/* ---------- hotspots ---------- */
.hs-on [data-hs]{outline:2px dashed var(--pink);outline-offset:3px;position:relative}
.hs-on [data-hs]::after{content:attr(data-hs);position:absolute;top:-16px;left:-16px;width:22px;height:22px;border-radius:50%;background:var(--pink);color:#fff;font:700 12px/22px Inter,sans-serif;text-align:center;border:2px solid #fff;z-index:60;pointer-events:none}
.hs-on .hs-r::after{left:auto;right:-16px}
.hs-on .win{overflow:visible}
.hs-on .convo{padding:16px 16px 4px 16px}
.hs-on .win-body{padding:16px}
</style>
</head>
<body>
<div class="proto-bar">
  <b>Chaos AI Assistant · Light management</b>
  <div class="step"><span class="num" id="stepNum">01</span><span id="stepTxt">Side panel open — default</span></div>
  <span class="hint" id="hint">Hover or click the ✦ button next to “Light management”.</span>
  <div class="spacer"></div>
  <label class="toggle"><input type="checkbox" id="hsToggle"><span class="sw"></span>Show hotspots</label>
  <button class="pbtn" id="resetBtn">Reset</button>
</div>

<div class="app" id="app">
  <div class="toolbar" aria-hidden="true">
    <div class="tb home"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3 3 10v11h6v-6h6v6h6V10z"/></svg></div>
    <div class="tb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></div>
    <div class="tb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h10"/></svg></div>
    <div class="tb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 9h18"/></svg></div>
    <div class="tb sep"></div>
    <div class="tb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9V16h7v-2.1A6 6 0 0 0 12 3z"/></svg></div>
    <div class="tb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 4 7v6c0 4 3.5 7 8 8 4.5-1 8-4 8-8V7z"/></svg></div>
    <div class="tb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V9l8-5 8 5v11M9 20v-6h6v6"/></svg></div>
    <div class="tb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/></svg></div>
    <div class="tb sep"></div>
    <div class="tb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="14" height="12" rx="1"/><path d="M7 21h14V9"/></svg></div>
    <div class="tb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M12 3 4 7.5v9L12 21l8-4.5v-9zM4 7.5 12 12l8-4.5M12 12v9"/></svg></div>
    <div class="tb ai"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9z"/></svg></div>
    <div style="flex:1"></div>
    <div class="tb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-8 8"/></svg></div>
    <div class="tb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></div>
    <div class="tb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4"/></svg></div>
    <div class="tb"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-2.7 1.1V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 7.5 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.6 1.6 0 0 0 1.8 14H1.7a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 3.3 7.5a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.6 1.6 0 0 0 8.5 2V2a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 2.7 1.1l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0 1.1 2.7h.1a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1.4z"/></svg></div>
  </div>

  <div class="body" id="appBody">
    <aside class="panel">
      <div class="panel-head">
        <h1>Light management</h1>
        <button class="ai-btn" id="aiBtn" data-hs="1" aria-label="Chaos AI Assistant">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9z"/></svg>
        </button>
        <div style="flex:1"></div>
        <button class="icon-btn" aria-label="Close panel"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 5l14 14M19 5 5 19"/></svg></button>
      </div>
      <div class="panel-body">
        <div class="row"><span class="preset">Light preset 1 <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="m5 9 7 7 7-7"/></svg></span><span class="dots">···</span></div>
        <div class="count">23 light objects</div>
        <div class="row"><div class="search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Search by name</div>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4a4a4a" stroke-width="1.6"><path d="M3 12V3h9l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4a4a4a" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><path d="M9 18h6M12 6a4 4 0 0 0-2 7.5V15h4v-1.5A4 4 0 0 0 12 6z"/></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4a4a4a" stroke-width="1.6"><path d="M4 4h12v12H4zM8 20h12V8" stroke-dasharray="2 2"/><path d="m7 10 2 2 4-4"/></svg>
        </div>
        <div class="lights" id="lights"></div>
      </div>
    </aside>

    <section class="viewport">
      <div class="scene" id="scene">
        <svg viewBox="0 0 1584 1040" preserveAspectRatio="xMidYMid slice">
          <defs>
            <linearGradient id="skyDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f9fd3"/><stop offset=".6" stop-color="#bcd6ef"/><stop offset="1" stop-color="#e8eef2"/></linearGradient>
            <linearGradient id="skyEve" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d2a5c"/><stop offset=".55" stop-color="#b8606a"/><stop offset="1" stop-color="#ffb066"/></linearGradient>
            <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d93a6"/><stop offset="1" stop-color="#3f5466"/></linearGradient>
            <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
          </defs>
          <rect width="1584" height="1040" fill="url(#skyDay)"/>
          <rect class="sky-eve" width="1584" height="1040" fill="url(#skyEve)"/>
          <circle class="sun" cx="1260" cy="160" r="46" fill="#fff6d8"/>
          <g fill="#fff" opacity=".85" filter="url(#blur)">
            <ellipse cx="300" cy="180" rx="220" ry="60"/><ellipse cx="520" cy="130" rx="160" ry="50"/><ellipse cx="1050" cy="250" rx="260" ry="70"/><ellipse cx="1350" cy="320" rx="200" ry="55"/>
          </g>
          <!-- city backdrop -->
          <g fill="#9aa8b4" opacity=".7"><rect x="40" y="560" width="120" height="140"/><rect x="170" y="520" width="90" height="180"/><rect x="1180" y="540" width="140" height="160"/><rect x="1330" y="500" width="100" height="200"/><rect x="1440" y="560" width="120" height="140"/></g>
          <!-- ground -->
          <rect y="690" width="1584" height="350" fill="#8e8a82"/>
          <path d="M600 1040 L980 690 L1120 690 L1584 900 L1584 1040Z" fill="#5d5e60"/>
          <g stroke="#e8e8e8" stroke-width="10" opacity=".8"><path d="M760 980l60-40M850 920l55-36M935 865l50-33"/></g>
          <!-- building -->
          <g id="building">
            <g fill="url(#glass)">
              <rect x="430" y="300" width="520" height="80" rx="40"/>
              <rect x="410" y="400" width="560" height="80" rx="40"/>
              <rect x="390" y="500" width="600" height="80" rx="40"/>
              <rect x="410" y="600" width="560" height="80" rx="40"/>
            </g>
            <g fill="#e9ecee"><rect x="410" y="378" width="560" height="14" rx="7"/><rect x="390" y="478" width="600" height="14" rx="7"/><rect x="370" y="578" width="640" height="14" rx="7"/><rect x="390" y="678" width="600" height="14" rx="7"/><rect x="430" y="286" width="520" height="14" rx="7"/></g>
            <g class="win-glow" fill="#ffc46b">
              <rect x="470" y="318" width="60" height="44" opacity=".9"/><rect x="560" y="318" width="60" height="44" opacity=".7"/><rect x="700" y="318" width="60" height="44"/><rect x="830" y="318" width="60" height="44" opacity=".8"/>
              <rect x="450" y="418" width="60" height="44"/><rect x="600" y="418" width="60" height="44" opacity=".75"/><rect x="740" y="418" width="60" height="44"/><rect x="880" y="418" width="60" height="44" opacity=".85"/>
              <rect x="430" y="518" width="60" height="44" opacity=".8"/><rect x="560" y="518" width="60" height="44"/><rect x="690" y="518" width="60" height="44" opacity=".7"/><rect x="820" y="518" width="60" height="44"/><rect x="920" y="518" width="50" height="44" opacity=".85"/>
              <rect x="460" y="618" width="60" height="44"/><rect x="620" y="618" width="60" height="44" opacity=".8"/><rect x="780" y="618" width="60" height="44"/>
            </g>
          </g>
          <!-- trees -->
          <g fill="#4f6b3a"><circle cx="1150" cy="640" r="70"/><circle cx="1210" cy="600" r="60"/><circle cx="1260" cy="660" r="70"/><circle cx="160" cy="700" r="60"/><circle cx="230" cy="680" r="50"/></g>
          <g fill="#3a3a3a"><rect x="1205" y="660" width="8" height="70"/><rect x="190" y="720" width="8" height="40"/></g>
        </svg>
      </div>
      <div class="eve-overlay"></div>
      <div class="vp-label" id="vpLabel">Viewport · Day</div>
    </section>

    <div class="tooltip" id="tooltip">Chaos AI Assistant</div>
    <div class="toast" id="toast"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const app = $('#app'), body = $('#appBody'), aiBtn = $('#aiBtn'), tip = $('#tooltip');
const scene = $('#scene');

/* ---------- lights list ---------- */
const LIGHTS = [
  ['Disk Light','<path d="M4 7h16M12 7v6M9 13h6" />'],
  ['Line Light','<path d="M5 19 19 5"/>'],
  ['Point Light 03','<rect x="4" y="8" width="7" height="5"/><rect x="13" y="12" width="7" height="5"/>'],
  ['Spot Light','<path d="M4 19h16L18 6z"/>'],
  ['Rect Light','<path d="M4 7h16M8 7v5h8V7"/>'],
  ['iES Light','<circle cx="12" cy="9" r="4"/><path d="M6 20l6-7 6 7"/>'],
  ['Self-illuminating','<circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>'],
];
$('#lights').innerHTML = LIGHTS.map(([n,p])=>`<div class="light" data-name="${n}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#4a4a4a" stroke-width="2">${p}</svg>${n}<span class="st"></span></div>`).join('');

/* ---------- state ---------- */
const S = { mode:'none', min:false, generating:false, hoverCard:false, tipShown:false, messages:[], sceneStack:['day'], timers:[], history:[] };
const ICON = {
  spark:'<svg width="14" height="14" viewBox="0 0 24 24" fill="#3b3b3b"><path d="M12 2l1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8zM19 14l.9 2.1L22 17l-2.1.9L19 20l-.9-2.1L16 17l2.1-.9z"/></svg>',
  minus:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>',
  close:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  send:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 4l17 8-17 8 3-8z"/><path d="M7 12h6"/></svg>',
  stop:'<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>',
  img:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="15" height="14" rx="1"/><path d="m3 16 5-5 6 6M18 3v6M15 6h6"/></svg>',
  vp:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 2"><rect x="4" y="4" width="16" height="16" rx="2"/><circle cx="12" cy="12" r="3" stroke-dasharray="0"/></svg>',
  menu:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>',
  plus:'<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg>',
  pop:'<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="7" width="12" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="9" y="3" width="12" height="12" rx="1"/></svg>',
};
const SUGGESTIONS = ['Create an evening atmosphere','Reduce the outside lighting','Turn off all lights'];

/* ---------- step indicator ---------- */
function step(){
  let n='01', t='Side panel open — default', h='Hover or click the ✦ button next to “Light management”.';
  const ta = document.querySelector('.win textarea');
  if (S.mode==='none'){ if (S.tipShown){ n='02'; t='Hover on AI Assistant button'; h='Click ✦ to open the mini dialog.'; } }
  else if (S.mode==='mini'){
    if (S.min){ n='03·min'; t='Mini dialog minimized'; h='Click the header to restore it.'; }
    else if (S.hoverCard){ n='04'; t='Hover on a suggested action'; h='Click the card to put its text into the input.'; }
    else if (ta && ta.value.trim()){ n='05'; t='Prompt ready — edit and send'; h='Extend the text if you like, then click the arrow (or press Enter) to send.'; }
    else { n='03'; t='AI mini dialog open'; h='Pick a suggestion to prefill the input, or type a prompt. Esc, ✕ or clicking outside closes.'; }
  } else {
    if (S.min){ n='08'; t='Assistant minimized'; h='Click the header or the ✦ button to restore.'; }
    else if (S.generating){ n='06'; t='Full assistant — working'; h='Wait for the result, or press ■ to stop.'; }
    else { n='07'; t='Response — changes applied'; h='Try Undo changes / Keep, ask a follow-up, minimize or close.'; }
  }
  $('#stepNum').textContent=n; $('#stepTxt').textContent=t; $('#hint').textContent=h;
}

/* ---------- tooltip ---------- */
let tipTimer;
aiBtn.addEventListener('mouseenter',()=>{
  if (S.mode!=='none') return;
  tipTimer=setTimeout(()=>{ positionTip(); tip.classList.add('show'); S.tipShown=true; step(); },500);
});
aiBtn.addEventListener('mouseleave',hideTip);
function hideTip(){ clearTimeout(tipTimer); tip.classList.remove('show'); if(S.tipShown){S.tipShown=false; step();} }
function positionTip(){
  const b=aiBtn.getBoundingClientRect(), r=body.getBoundingClientRect();
  tip.style.left=(b.left-r.left+b.width/2-tip.offsetWidth/2)+'px'; tip.style.top=(b.bottom-r.top+6)+'px';
}

/* ---------- windows ---------- */
let winEl=null;
function anchor(){ const b=aiBtn.getBoundingClientRect(), r=body.getBoundingClientRect(); return {x:b.left-r.left, y:b.top-r.top}; }
function removeWin(){ if(winEl){winEl.remove(); winEl=null;} }
function head(){ return `<div class="win-head" id="winHead" data-hs="9">
  <div class="ttl">${ICON.spark} Chaos AI Assistant</div>
  <button class="icon-btn" id="minBtn" data-hs="4" aria-label="Minimize">${ICON.minus}</button>
  <button class="icon-btn hs-r" id="closeBtn" data-hs="5" aria-label="Close">${ICON.close}</button></div>`; }
function inputHTML(full){ return `<div class="input" data-hs="3"><div class="input-in">
  <textarea id="prompt" rows="2" placeholder="What’s something you’d like to learn or create?"></textarea>
  <div class="tools">${full?`<button class="sq" title="Attach image">${ICON.img}</button><button class="sq" title="Use viewport as context">${ICON.vp}</button>`:''}
  <button class="send hs-r" id="sendBtn" data-hs="3" disabled aria-label="Send">${ICON.send}</button></div></div></div>`; }

function openMini(){
  hideTip(); removeWin(); S.mode='mini'; S.min=false; S.hoverCard=false;
  aiBtn.classList.add('selected');
  const a=anchor();
  winEl=document.createElement('div'); winEl.className='win mini';
  winEl.style.cssText=`left:${a.x+36}px;top:${a.y}px;width:426px`;
  winEl.innerHTML = head() + `<div class="win-body">
    <div class="ctx">Improve the lighting in your scene</div>
    <div class="cards" data-hs="2">${SUGGESTIONS.map(s=>`<button class="card">${s}</button>`).join('')}</div>
    ${inputHTML(false)}</div>`;
  body.appendChild(winEl); wireCommon();
  winEl.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('mouseenter',()=>{S.hoverCard=true;step();});
    c.addEventListener('mouseleave',()=>{S.hoverCard=false;step();});
    c.addEventListener('click',()=>prefill(c));
  });
  step();
}

function openFull(){
  removeWin(); S.mode='full'; S.min=false;
  aiBtn.classList.add('selected');
  const r=body.getBoundingClientRect();
  winEl=document.createElement('div'); winEl.className='win full';
  winEl.style.cssText=`left:330px;top:26px;width:378px;height:${Math.min(743, r.height-52)}px`;
  winEl.innerHTML = head() + `<div class="win-body">
    <div class="chat-bar"><button class="icon-btn" id="histBtn" title="Chat history">${ICON.menu}</button>
      <button class="newbtn" id="newBtn">${ICON.plus} New</button><div style="flex:1"></div>
      <button class="icon-btn" title="Pop out / dock">${ICON.pop}</button></div>
    <div class="convo" id="convo"></div>
    ${inputHTML(true)}</div>`;
  body.appendChild(winEl); wireCommon();
  $('#newBtn').addEventListener('click',newChat);
  $('#histBtn').addEventListener('click',toggleHistory);
  renderConvo(); step();
}

function wireCommon(){
  $('#minBtn').addEventListener('click',e=>{e.stopPropagation(); setMin(true);});
  $('#closeBtn').addEventListener('click',e=>{e.stopPropagation(); closeAll();});
  $('#winHead').addEventListener('click',()=>{ if(S.min) setMin(false); });
  const ta=$('#prompt'), sb=$('#sendBtn');
  const sync=()=>{ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,120)+'px';
    if(!S.generating) sb.disabled=!ta.value.trim(); step(); };
  ta.addEventListener('input',sync);
  ta.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); if(ta.value.trim() && !S.generating) send(ta.value.trim()); } });
  sb.addEventListener('click',()=>{ if(S.generating) stopGen(); else if(ta.value.trim()) send(ta.value.trim()); });
  setTimeout(()=>ta.focus(),50);
}
function setMin(v){ S.min=v; winEl.classList.toggle('min',v); if(!v && S.mode==='full'){ const r=body.getBoundingClientRect(); winEl.style.height=Math.min(743,r.height-52)+'px'; } if(v) winEl.style.height='auto'; step(); }
function closeAll(){ stopTimers(); S.generating=false; removeWin(); S.mode='none'; S.min=false; aiBtn.classList.remove('selected'); step(); }

/* ---------- conversation ---------- */
function plan(prompt){
  const p=prompt.toLowerCase();
  if (/(evening|dusk|sunset|night|atmos)/.test(p)) return {
    steps:['Read “Light preset 1” (23 light objects)','Read sun & sky settings','Moved sun to golden hour','Switched sky to “Dusk”','Turned on 7 interior lights (2700 K)'],
    title:'Done — I set up an evening atmosphere:',
    bullets:['Sun moved to 19:10 (golden hour)','Sky switched to the “Dusk” preset','7 interior lights turned on — warm white 2700 K','Exposure +0.5 EV'],
    scene:'evening', lights:['Disk Light','Point Light 03','Rect Light','Self-illuminating']};
  if (/(reduce|outside|dim|darker|less)/.test(p)) return {
    steps:['Read sun & sky settings','Lowered sun intensity','Reduced sky brightness'],
    title:'Done — I reduced the outside lighting:',
    bullets:['Sun intensity 100% → 60%','Sky brightness −30%','Interior lights unchanged'],
    scene:'dim', lights:[]};
  if (/(turn off|off all|lights off|switch off)/.test(p)) return {
    steps:['Read “Light preset 1” (23 light objects)','Turned off 23 lights'],
    title:'Done — I turned off all lights:',
    bullets:['23 light objects switched off','Sun & sky unchanged'],
    scene:'lightsoff', lights:LIGHTS.map(l=>l[0])};
  return { steps:['Read scene context','Read “Light preset 1” (23 light objects)'],
    title:'Here’s what I’d suggest:',
    bullets:['In the product, the assistant answers here using the Light management MCP tools.','Try “Create an evening atmosphere” to see changes applied to the scene.'],
    scene:null, lights:[], info:true };
}
function send(text){
  if (S.mode!=='full') openFull();
  const ta=$('#prompt'); ta.value=''; ta.style.height='';
  if (!S.history.includes(text)) S.history.unshift(text);
  S.messages.push({role:'user', text});
  const pl=plan(text);
  const msg={role:'ai', plan:pl, done:0, state:'working'};
  S.messages.push(msg);
  S.generating=true; setGenUI(true); renderConvo(); step();
  pl.steps.forEach((_,i)=>{
    S.timers.push(setTimeout(()=>{
      msg.done=i+1;
      if (i===Math.floor(pl.steps.length/2) && pl.scene) applyScene(pl.scene, pl.lights);
      if (msg.done===pl.steps.length){ msg.state = pl.info?'info':'result'; S.generating=false; setGenUI(false); }
      renderConvo(); step();
    }, 700*(i+1)));
  });
}
function prefill(card){
  const ta=$('#prompt'); if(!ta || S.generating) return;
  winEl.querySelectorAll('.card').forEach(c=>c.classList.toggle('picked', c===card));
  ta.value=card.textContent; ta.dispatchEvent(new Event('input'));
  ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
  const sb=$('#sendBtn'); sb.classList.remove('nudge'); void sb.offsetWidth; sb.classList.add('nudge');
}
function stopTimers(){ S.timers.forEach(clearTimeout); S.timers=[]; }
function stopGen(){
  stopTimers(); const m=S.messages[S.messages.length-1];
  if (m && m.role==='ai'){ m.state='stopped'; }
  S.generating=false; setGenUI(false); renderConvo(); step();
}
function setGenUI(on){
  const ta=$('#prompt'), sb=$('#sendBtn'); if(!ta) return;
  ta.disabled=on; ta.placeholder = on ? 'Generating… press ■ to stop' : (S.messages.length ? 'Ask a follow-up…' : 'What’s something you’d like to learn or create?');
  sb.classList.toggle('stop',on); sb.innerHTML = on?ICON.stop:ICON.send; sb.disabled = on?false:!ta.value.trim();
  sb.setAttribute('data-hs', on?'6':'3'); sb.setAttribute('aria-label', on?'Stop':'Send');
  if(!on) ta.focus();
}
function renderConvo(){
  const c=$('#convo'); if(!c) return;
  if (!S.messages.length){
    c.innerHTML = `<div class="empty"><div class="ctx">Improve the lighting in your scene</div><div class="cards" data-hs="2">${SUGGESTIONS.map(s=>`<button class="card">${s}</button>`).join('')}</div></div>`;
    c.querySelectorAll('.card').forEach(b=>b.addEventListener('click',()=>prefill(b)));
    return;
  }
  c.innerHTML = S.messages.map((m,idx)=>{
    if (m.role==='user') return `<div class="msg-user">${esc(m.text)}</div>`;
    const pl=m.plan;
    const steps = `<ul class="steps">${pl.steps.map((s,i)=> i<m.done ? `<li>✓ ${s}</li>` : (i===m.done && m.state==='working' ? `<li><span class="spin"></span> ${s}…</li>` : '')).join('')}</ul>`;
    if (m.state==='working') return `<div class="msg-ai"><h4>Working on it…</h4>${steps}</div>`;
    if (m.state==='stopped') return `<div class="msg-ai">${steps}<div class="status">■ Stopped. Changes already applied stay in the scene.</div></div>`;
    const actions = m.state==='result' && !m.resolved ? `<div class="actions" data-hs="7"><button class="btn sec" data-undo="${idx}">Undo changes</button><button class="btn pri hs-r" data-keep="${idx}" data-hs="8">Keep</button></div>` : '';
    const res = m.resolved==='undo' ? '<div class="status">↺ Changes undone.</div>' : m.resolved==='keep' ? '<div class="status">✓ Changes kept.</div>' : '';
    return `<div class="msg-ai"><h4>${pl.title}</h4><ul>${pl.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>
      ${m.state==='result'?'<div class="muted">The viewport is already updated. Keep the changes or undo them in one step.</div>':''}${actions}${res}</div>`;
  }).join('');
  c.querySelectorAll('[data-undo]').forEach(b=>b.addEventListener('click',()=>{ const m=S.messages[b.dataset.undo]; m.resolved='undo'; undoScene(); renderConvo(); toast('Changes undone'); }));
  c.querySelectorAll('[data-keep]').forEach(b=>b.addEventListener('click',()=>{ const m=S.messages[b.dataset.keep]; m.resolved='keep'; renderConvo(); toast('Changes kept'); }));
  c.scrollTop=c.scrollHeight;
}
function esc(s){ return s.replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
function newChat(){ stopTimers(); S.generating=false; S.messages=[]; setGenUI(false); renderConvo(); step(); }
function toggleHistory(){
  const ex=winEl.querySelector('.history'); if(ex){ex.remove();return;}
  const h=document.createElement('div'); h.className='history';
  h.innerHTML = '<div class="h">Recent chats</div>' + (S.history.length? S.history.map(x=>`<div>${esc(x)}</div>`).join('') : '<div style="color:#8c8c8f">No chats yet</div>');
  winEl.appendChild(h);
}

/* ---------- scene ---------- */
const SCENE_LABEL={day:'Day',evening:'Evening atmosphere',dim:'Outside lighting reduced',lightsoff:'All lights off'};
function setScene(m){ scene.className='scene '+(m==='day'?'':m); $('#vpLabel').textContent='Viewport · '+SCENE_LABEL[m]; }
function applyScene(m, lights){ S.sceneStack.push(m); setScene(m);
  document.querySelectorAll('.light').forEach(l=>{ const on=lights.includes(l.dataset.name); l.classList.toggle('changed',on); l.querySelector('.st').textContent = m==='lightsoff'?'off':'2700 K'; }); }
function undoScene(){ if(S.sceneStack.length>1) S.sceneStack.pop(); setScene(S.sceneStack[S.sceneStack.length-1]); document.querySelectorAll('.light').forEach(l=>l.classList.remove('changed')); }

/* ---------- global ---------- */
aiBtn.addEventListener('click',e=>{
  e.stopPropagation(); hideTip();
  if (S.mode==='none') openMini();
  else if (S.mode==='mini') closeAll();
  else { if (S.min) setMin(false); else { winEl.animate([{transform:'scale(1)'},{transform:'scale(1.015)'},{transform:'scale(1)'}],{duration:220}); $('#prompt').focus(); } }
});
document.addEventListener('mousedown',e=>{
  if (S.mode==='mini' && winEl && !winEl.contains(e.target) && !aiBtn.contains(e.target) && !e.target.closest('.proto-bar')) closeAll();
  if (winEl){ const h=winEl.querySelector('.history'); if(h && !h.contains(e.target) && !e.target.closest('#histBtn')) h.remove(); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape' && S.mode==='mini') closeAll(); });
let toastT; function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('show'),1600); }
$('#hsToggle').addEventListener('change',e=>app.classList.toggle('hs-on',e.target.checked));
$('#resetBtn').addEventListener('click',()=>{ closeAll(); S.messages=[]; S.history=[]; S.sceneStack=['day']; setScene('day'); document.querySelectorAll('.light').forEach(l=>l.classList.remove('changed')); });
window.addEventListener('resize',()=>{ if(S.mode==='full' && !S.min){ const r=body.getBoundingClientRect(); winEl.style.height=Math.min(743,r.height-52)+'px'; } });
step();
</script>
</body>
</html>
