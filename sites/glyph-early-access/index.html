/* ---------- Base ---------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
/* Always reserve the scrollbar's space, so short and long pages line up and nothing shifts sideways */
html { scrollbar-gutter: stable; }
@supports not (scrollbar-gutter: stable) { html { overflow-y: scroll; } }
body {
  font-family: var(--font-sans); font-size: 14px; line-height: 20px;
  background: var(--background-primary); color: var(--foreground-default);
  -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column;
}
[hidden] { display: none !important; }
img { max-width: 100%; }
a { color: var(--foreground-link); }
button, input, textarea, select { font: inherit; color: inherit; }
h1, h2, h3, h4, p { margin: 0; }
h1, h2, h3 { text-wrap: balance; color: var(--foreground-strong); }
.h1 { font-size: 24px; line-height: 32px; font-weight: 500; }
.h2 { font-size: 18px; line-height: 24px; font-weight: 600; }
.h3 { font-size: 16px; line-height: 24px; font-weight: 600; }
.h4 { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--foreground-strong); }
.body1 { font-size: 16px; line-height: 24px; }
.body2 { font-size: 12px; line-height: 16px; }
.caption { font-size: 11px; line-height: 16px; letter-spacing: 0.004em; color: var(--foreground-subtle); }
.overline { font-size: 12px; line-height: 16px; color: var(--foreground-moderate); font-weight: 600; }
.muted { color: var(--foreground-moderate); }
.tnum { font-variant-numeric: tabular-nums; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); }
#main:focus, #main:focus-visible { box-shadow: none; outline: none; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

/* ---------- Header ---------- */
.app-header { position: sticky; top: 0; z-index: 30; height: var(--header-h); background: var(--background-secondary); border-bottom: 1px solid var(--border-static-secondary); display: flex; align-items: stretch; }
.brand-tile { width: var(--header-h); height: var(--header-h); flex: none; display: block; }
.brand-tile svg { width: 100%; height: 100%; display: block; }
.header-inner { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-16); padding-inline: var(--spacing-16) max(16px, env(safe-area-inset-right, 0px)); }
.product { display: flex; align-items: center; gap: var(--spacing-12); min-width: 0; }
.product-name { font-weight: 600; font-size: 14px; color: var(--foreground-strong); white-space: nowrap; }
.product-sub { font-size: 12px; color: var(--foreground-subtle); white-space: nowrap; }
.vdivider { width: 1px; height: 20px; background: var(--border-static-primary); }
.header-actions { display: flex; align-items: center; gap: var(--spacing-8); position: relative; }

/* ---------- Main tabs ---------- */
.tabs-bar { position: sticky; top: var(--header-h); z-index: 25; background: var(--background-secondary); }
.tabs-inner { max-width: 1200px; margin: 0 auto; height: var(--tabs-h); display: flex; align-items: flex-end; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
/* ---------- Tabs (Figma 05. Components > Tabs base component, Type=Line) ----------
   States: default, hover, selected, selected + hover, disabled. Sizes: S 24, M 32, L 40. */
.tabs-line { display: flex; align-items: flex-end; width: 100%; border-bottom: 2px solid var(--border-static-primary); gap: var(--tab-gap, 8px); }
.tab, .ptab {
  --tab-h: 40px; --tab-pad: 8px; --tab-fs: 16px; --tab-lh: 24px;
  display: inline-flex; align-items: center; gap: var(--tab-pad); flex: none;
  height: var(--tab-h); padding: 0 var(--tab-pad); margin-bottom: -2px;
  font-size: var(--tab-fs); line-height: var(--tab-lh); font-weight: 600; white-space: nowrap; text-decoration: none;
  color: var(--foreground-moderate); background: transparent;
  border: 0; border-bottom: 2px solid var(--border-static-primary); border-radius: 0; cursor: pointer;
  transition: background-color .15s ease-out, color .15s ease-out, border-color .15s ease-out;
}
.tab:hover, .ptab:hover { color: var(--foreground-hover-secondary); border-bottom-color: var(--foreground-hover-secondary); }
.tab[aria-current="page"], .ptab[aria-selected="true"] { background: var(--background-selected-subtle); color: var(--foreground-selected-primary); border-bottom-color: var(--border-action-selected); }
.tab[aria-current="page"]:hover, .ptab[aria-selected="true"]:hover { background: var(--background-selected-strong); color: var(--foreground-hover-tertiary); border-bottom-color: var(--foreground-hover-tertiary); }
.tab[aria-disabled="true"], .ptab[aria-disabled="true"], .ptab:disabled { color: var(--foreground-disabled-secondary); border-bottom-color: var(--border-action-disabled); background: transparent; cursor: not-allowed; pointer-events: none; }
.tab:focus-visible, .ptab:focus-visible { box-shadow: inset 0 0 0 2px var(--border-action-selected); }
.tabs-m .tab, .tabs-m .ptab, .ptab { --tab-h: 32px; --tab-pad: 6px; --tab-fs: 12px; --tab-lh: 16px; }
.tabs-m { --tab-gap: 6px; }
.tabs-s .tab, .tabs-s .ptab { --tab-h: 24px; --tab-pad: 4px; --tab-fs: 12px; --tab-lh: 16px; }
.tabs-s { --tab-gap: 4px; }
.count-pill { min-width: 20px; height: 20px; padding: 0 var(--spacing-4); border-radius: var(--radius-2); background: var(--status-grey-mild); color: var(--status-grey-strong); font-size: 12px; line-height: 16px; font-weight: 600; display: inline-grid; place-items: center; }
.tab .short { display: none; }
.tab-ok { display: inline-grid; color: var(--status-success-strong); }
.tab-ok svg { width: 14px; height: 14px; }
.tab-n { font-size: 11px; font-weight: 600; color: var(--foreground-subtle); }
.tab-dot { width: 7px; height: 7px; border-radius: 50%; border: 1.5px solid var(--foreground-weak); }
.tab[aria-current="page"] .count-pill, .ptab[aria-selected="true"] .count-pill { background: var(--background-secondary); color: var(--foreground-selected-primary); }

/* ---------- Buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--spacing-4); height: 32px; padding: 0 10px; border-radius: var(--radius-6); border: 0; background: var(--button-primary); color: var(--foreground-on-colour); font-size: 14px; line-height: 16px; font-weight: 600; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background-color .15s ease-out, color .15s ease-out, box-shadow .15s ease-out; }
/* ---------- Buttons (Figma 05. Components > Buttons) ----------
   Priority: Primary (.btn), Secondary (.btn-secondary), Tertiary (.btn-ghost); Destructive (.btn-danger).
   Size: M 32px (default), L 36px (.btn-lg). States: default, hover, selected (:active), disabled. */
.btn:hover { background: var(--background-hover-primary); }
.btn:active { background: var(--background-selected-bold); }
.btn svg { width: 16px; height: 16px; flex: none; }
.btn-lg { height: 36px; padding: 0 12px; }
.btn-secondary { background: transparent; color: var(--foreground-default); box-shadow: inset 0 0 0 2px var(--border-static-primary); }
.btn-secondary:hover { background: var(--background-action-hover-secondary); color: var(--foreground-hover-secondary); }
.btn-secondary:active { background: var(--background-selected-strong); color: var(--foreground-selected-primary); }
.btn-secondary:focus-visible { box-shadow: inset 0 0 0 2px var(--border-static-primary), var(--focus-ring); }
.btn-ghost { background: transparent; color: var(--foreground-default); }
.btn-ghost:hover { background: var(--background-action-hover-secondary); color: var(--foreground-hover-secondary); }
.btn-ghost:active { background: var(--background-selected-strong); color: var(--foreground-selected-primary); }
.btn-danger { background: var(--status-error-default); color: var(--foreground-on-colour); }
.btn-danger:hover { background: var(--status-error-bold); }
.btn-danger:active { background: var(--status-error-extra-bold); }
.btn-block { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { background: var(--background-disabled-primary); color: var(--foreground-disabled-tertiary); cursor: not-allowed; pointer-events: none; }
.btn-secondary[disabled], .btn-secondary[aria-disabled="true"] { background: transparent; color: var(--foreground-disabled-secondary); box-shadow: inset 0 0 0 2px var(--border-action-disabled); }
.btn-ghost[disabled], .btn-ghost[aria-disabled="true"] { background: transparent; color: var(--foreground-disabled-secondary); }
.btn-danger[disabled] { background: var(--status-error-mild); color: var(--foreground-disabled-tertiary); }
/* Icon-only buttons: Buttons, Icon=Icon Only, Priority=Tertiary. M 32px (r6), S 28px (r4). Delete = Destructive tertiary. */
.icon-btn { width: 32px; height: 32px; padding: 0; display: inline-grid; place-items: center; border-radius: var(--radius-6); border: 0; background: transparent; color: var(--foreground-default); cursor: pointer; flex: none; transition: background-color .15s ease-out, color .15s ease-out; }
.icon-btn:hover { background: var(--background-action-hover-secondary); color: var(--foreground-hover-secondary); }
.icon-btn:active { background: var(--background-selected-strong); color: var(--foreground-selected-primary); }
.icon-btn svg { width: 16px; height: 16px; }
.icon-btn.sm { width: 28px; height: 28px; border-radius: var(--radius-4); }
.icon-btn.danger { color: var(--status-error-default); }
.icon-btn.danger:hover { color: var(--status-error-semi-strong); background: var(--status-error-mild); }
.icon-btn[disabled] { color: var(--foreground-disabled-secondary); background: transparent; pointer-events: none; }
.session-badge { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 var(--spacing-12); border-radius: var(--radius-4); background: var(--background-quinary); border: 1px solid var(--border-static-secondary); font-size: 12px; font-weight: 600; color: var(--foreground-moderate); cursor: pointer; }
.session-badge:hover { color: var(--foreground-strong); border-color: var(--border-static-primary); }
.session-badge svg { width: 14px; height: 14px; }
.popover { position: absolute; right: 0; top: calc(100% + 8px); width: min(360px, calc(100vw - 32px)); background: var(--background-secondary); border: 1px solid var(--border-static-secondary); border-radius: var(--radius-8); box-shadow: var(--elevation-02); padding: var(--spacing-16); display: grid; gap: var(--spacing-12); z-index: 40; }
.linkish { background: none; border: 0; padding: 0; color: var(--foreground-link); font-weight: 600; font-size: 12px; line-height: 16px; cursor: pointer; display: inline-flex; gap: 4px; align-items: center; text-decoration: underline; text-underline-offset: 2px; }
.linkish:hover { color: var(--foreground-action-hover-quaternary); }
.linkish:active { color: var(--foreground-action-selected-tertiary); }
.linkish svg { width: 14px; height: 14px; }

/* ---------- Shell ---------- */
.shell { flex: 1; width: 100%; max-width: 1200px; margin: 0 auto; display: grid; gap: var(--spacing-24); align-content: start; padding-block: var(--spacing-24) var(--spacing-64); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.shell.single { max-width: 560px; }
.shell.auth-shell { max-width: none; padding: 0; align-content: stretch; }
.shell.auth-shell .main { gap: 0; }
/* ---------- Login ---------- */
.auth-stage { position: relative; overflow: hidden; isolation: isolate; min-height: calc(100vh - var(--header-h) - 58px); display: grid; place-items: start center; padding: clamp(24px, 9vh, 112px) max(16px, env(safe-area-inset-right, 0px)) var(--spacing-40) max(16px, env(safe-area-inset-left, 0px)); background-color: var(--background-quaternary); background-size: cover; background-position: center; }
/* Login background: the floor plan, softened (blur + low contrast), under a blue frosted-glass layer.
   The login panel itself uses the Eris foundation colours (surface, border, elevation). */
.auth-stage::before { content: ""; position: absolute; inset: -32px; z-index: -2; background: var(--login-bg) center / cover no-repeat; filter: grayscale(1) blur(2px); opacity: .5; pointer-events: none; }
.auth-stage::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; -webkit-backdrop-filter: blur(1.5px) saturate(120%); backdrop-filter: blur(1.5px) saturate(120%);
  background: radial-gradient(120% 90% at 50% 30%, rgba(244, 251, 255, .5) 0%, rgba(229, 244, 252, .74) 60%, rgba(214, 234, 246, .88) 100%); }
.auth { position: relative; z-index: 1; width: 100%; max-width: 460px; border-radius: var(--radius-8);
  background: var(--background-secondary); border: 1px solid var(--border-static-secondary); box-shadow: var(--elevation-02); }
[data-theme="dark"] .auth-stage::before { filter: grayscale(1) invert(1) blur(2px); opacity: .3; }
[data-theme="dark"] .auth-stage::after { background: radial-gradient(120% 90% at 50% 30%, rgba(20, 34, 44, .55) 0%, rgba(16, 26, 34, .8) 60%, rgba(12, 18, 24, .92) 100%); }

.auth-panel { padding: var(--spacing-40) var(--spacing-40) var(--spacing-32); display: grid; gap: var(--spacing-24); align-content: start; }
/* Same size in both states, so switching never moves the panel */
@media (min-width: 861px) { .auth { min-height: 640px; } .auth.has-preview { min-height: 790px; } .auth .auth-panel { min-height: inherit; } .auth-privacy { align-self: end; } }
/* Switcher: one track, raised selected option */
.switcher { display: grid; grid-template-columns: 1fr 1fr; gap: var(--spacing-4); padding: var(--spacing-4); border-radius: var(--radius-4); background: var(--background-primary); }
.switcher button { height: 24px; border: 0; border-radius: var(--radius-4); background: transparent; font-size: 12px; line-height: 16px; font-weight: 400; color: var(--foreground-default); cursor: pointer; transition: background-color .15s ease-out, color .15s ease-out; }
.switcher button:hover { background: var(--background-hover-mild); color: var(--segment-accent); }
.switcher button[aria-pressed="true"] { background: var(--segment-selected-bg); color: var(--segment-accent); font-weight: 600; box-shadow: inset 0 0 0 1px var(--border-action-selected); }
.check.consent { align-items: flex-start; font-size: 12px; line-height: 16px; color: var(--foreground-default); }
.check.consent input { margin-top: 1px; }
.privacy-text { display: grid; gap: var(--spacing-4); padding: var(--spacing-8) var(--spacing-12); border-radius: var(--radius-4); background: var(--background-quinary); }
.privacy-text p { margin: 0; }
.privacy-title { font-weight: 600; color: var(--foreground-strong); }
.pw-wrap { position: relative; }
.btn.is-busy { pointer-events: none; cursor: progress; }
.btn-spinner { width: 16px; height: 16px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35); border-top-color: #ffffff; animation: btn-spin .7s linear infinite; flex: none; }
@keyframes btn-spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .btn-spinner { animation-duration: 2s; } }
.busy-note { text-align: center; margin-top: calc(var(--spacing-8) * -1); }
.pw-wrap .input { padding-right: 44px; }
.pw-wrap .icon-btn { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); }
.mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; letter-spacing: 0.02em; }
.preview-chip { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: var(--radius-2); background: var(--status-warning-mild); color: var(--status-warning-strong); font-size: 11px; font-weight: 600; margin-left: 4px; }
.auth-privacy { color: var(--foreground-subtle); }
.user-chip { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 var(--spacing-12); border-radius: var(--radius-4); background: var(--background-quinary); border: 1px solid var(--border-static-secondary); font-size: 12px; font-weight: 600; color: var(--foreground-strong); max-width: 200px; }
a.user-chip { color: var(--foreground-default); text-decoration: none; cursor: pointer; transition: background-color .15s ease-out, color .15s ease-out, border-color .15s ease-out; }
a.user-chip:hover { background: var(--background-action-hover-secondary); border-color: var(--background-action-hover-secondary); color: var(--foreground-hover-secondary); }
a.user-chip:hover svg { color: currentColor; }
a.user-chip[aria-current="page"] { background: var(--background-selected-subtle); border-color: var(--border-action-selected); color: var(--foreground-selected-primary); }
a.user-chip[aria-current="page"] svg { color: currentColor; }
.user-chip svg { width: 14px; height: 14px; flex: none; color: var(--foreground-moderate); }
.user-chip .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.save-state.offline .sdot { background: var(--status-warning-strong); }
@media (max-width: 1100px) { .hide-md { display: none !important; } }
@media (max-width: 860px) {
  .auth-stage { background-color: var(--background-primary); place-items: start center; padding-top: var(--spacing-16); min-height: 0; }
  .auth-stage::before, .auth-stage::after { display: none; }
  .auth { box-shadow: none; }
  .auth-panel { padding: var(--spacing-24) var(--spacing-16); }
}
@media (max-width: 760px) { .user-chip .lbl { display: none; } .user-chip { padding: 0 var(--spacing-8); } }
.main { min-width: 0; display: grid; gap: var(--spacing-24); align-content: start; }

/* ---------- Week stepper ---------- */
.progress-line { display: flex; align-items: center; justify-content: space-between; gap: var(--spacing-12); margin-bottom: var(--spacing-12); flex-wrap: wrap; }
.track { height: 4px; border-radius: 2px; background: var(--background-hover-mild); overflow: hidden; margin-bottom: var(--spacing-12); }
.track span { display: block; height: 100%; background: var(--status-success-semi); transition: width .3s ease-out; }
.stepper { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--spacing-8); }
.st { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--spacing-8); align-items: start; padding: var(--spacing-12); border-radius: var(--radius-6); border: 1px solid var(--border-static-secondary); background: var(--background-secondary); text-decoration: none; color: inherit; min-width: 0; transition: border-color .15s ease-out, background-color .15s ease-out; }
.st:hover { border-color: var(--border-static-primary); }
.st[aria-current="step"] { border-color: var(--border-action-selected); background: var(--background-selected-mild); box-shadow: inset 0 0 0 1px var(--border-action-selected); }
.st-dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; border: 1.5px solid var(--foreground-weak); color: var(--foreground-moderate); background: var(--background-secondary); font-variant-numeric: tabular-nums; }
.st-dot svg { width: 14px; height: 14px; }
.st.done .st-dot { background: var(--status-success-semi); border-color: var(--status-success-semi); color: #ffffff; }
.st.next .st-dot { border-color: var(--background-action-default); background: var(--background-action-default); color: var(--foreground-on-colour); }
.st-text { display: grid; gap: 2px; min-width: 0; }
.st-week { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--foreground-strong); }
.st-title { font-size: 11px; line-height: 16px; color: var(--foreground-moderate); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.st-status { font-size: 11px; line-height: 16px; color: var(--foreground-subtle); }
.st.done .st-status { color: var(--status-success-strong); font-weight: 600; }
.st.next .st-status { color: var(--foreground-selected-primary); font-weight: 600; }
.st.end { border-style: dashed; }
.stepper-caption { display: none; }

/* ---------- Week layout ---------- */
.week-layout { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: var(--spacing-24); align-items: start; }
.week-main { display: grid; gap: var(--spacing-24); min-width: 0; }
.page-head { display: grid; gap: var(--spacing-8); }
.page-head p { max-width: 68ch; }
.page-head p.one-line { max-width: none; }
.summary { display: grid; margin: 0; }
.summary-row { display: grid; grid-template-columns: minmax(160px, 280px) minmax(0, 1fr); gap: var(--spacing-16); padding: var(--spacing-12) 0; border-top: 1px solid var(--border-static-secondary); }
.summary-row:first-child { border-top: 0; padding-top: 0; }
.summary dt { font-size: 14px; line-height: 20px; color: var(--foreground-moderate); }
.summary dd { margin: 0; font-size: 14px; line-height: 20px; color: var(--foreground-strong); white-space: pre-wrap; overflow-wrap: anywhere; }
.summary dd.none { color: var(--foreground-subtle); }
@media (max-width: 720px) { .summary-row { grid-template-columns: minmax(0, 1fr); gap: var(--spacing-4); } }
.head-row { display: flex; align-items: center; gap: var(--spacing-12); flex-wrap: wrap; }
.share-strip { display: flex; align-items: center; gap: var(--spacing-8); flex-wrap: wrap; padding: var(--spacing-12) var(--spacing-16); border-radius: var(--radius-6); background: var(--background-secondary); border: 1px solid var(--border-static-secondary); }
.share-strip .label { font-size: 12px; font-weight: 600; color: var(--foreground-moderate); margin-right: var(--spacing-8); }

/* ---------- Cards ---------- */
.card { background: var(--background-secondary); border: 1px solid var(--border-static-secondary); border-radius: var(--radius-8); padding: var(--spacing-24); min-width: 0; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--spacing-16); margin-bottom: var(--spacing-16); flex-wrap: wrap; }
.card-head > div { display: grid; gap: var(--spacing-4); min-width: 0; }
.card.tinted { background: var(--background-selected-mild); border-color: var(--background-selected-subtle); }
.stack { display: grid; gap: var(--spacing-24); }
.stack-16 { display: grid; gap: var(--spacing-16); }
.stack-12 { display: grid; gap: var(--spacing-12); }
.stack-8 { display: grid; gap: var(--spacing-8); }
.row { display: flex; gap: var(--spacing-12); align-items: center; flex-wrap: wrap; }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--spacing-16) var(--spacing-24); }

/* ---------- Form controls ---------- */
.q { display: grid; gap: var(--spacing-8); min-width: 0; align-content: start; }
.q-label { font-size: 14px; line-height: 20px; font-weight: 600; color: var(--foreground-strong); }
.q-label .opt { font-weight: 400; color: var(--foreground-subtle); }
.q-help { font-size: 12px; line-height: 16px; color: var(--foreground-moderate); margin-top: -4px; }
.input { width: 100%; min-width: 0; height: 36px; padding: 0 var(--spacing-12); background: var(--background-input); color: var(--foreground-strong); border: 1px solid var(--border-static-primary); border-radius: var(--radius-4); font-size: 14px; line-height: 20px; transition: border-color .15s ease-out, box-shadow .15s ease-out; }
.input::placeholder { color: var(--foreground-weak); }
.input:hover { border-color: var(--foreground-subtle); }
.input:focus { outline: none; border-color: var(--border-action-selected); box-shadow: var(--focus-ring); }
.input.invalid { border-color: var(--border-action-error); }
.textarea { height: auto; min-height: 64px; padding: var(--spacing-8) var(--spacing-12); resize: vertical; }
select.input { padding-right: 28px; }
.input-unit { position: relative; max-width: 220px; }
.input-unit .input { padding-right: 64px; }
.input-unit .unit { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--foreground-subtle); pointer-events: none; }
input[type="date"].input { max-width: 200px; }
.field-error { font-size: 12px; color: var(--status-error-strong); display: flex; gap: 6px; align-items: center; }
.field-error svg { width: 14px; height: 14px; flex: none; }
/* Segmented control (05. Components): track background-primary, 4px padding and gap, radius 4; items 24px, Regular 12/16 */
.seg { display: inline-flex; flex-wrap: wrap; gap: var(--spacing-4); padding: var(--spacing-4); border-radius: var(--radius-4); background: var(--background-primary); max-width: 100%; justify-self: start; align-self: start; }
.seg .seg-btn { height: 24px; padding: 0 var(--spacing-8); border: 0; border-radius: var(--radius-4); background: transparent; font-size: 12px; line-height: 16px; font-weight: 400; color: var(--foreground-default); cursor: pointer; transition: background-color .15s ease-out, color .15s ease-out; }
.seg .seg-btn:disabled { background: var(--background-disabled-secondary); color: var(--foreground-disabled-tertiary); cursor: not-allowed; }
.seg .seg-btn:hover { background: var(--background-hover-mild); color: var(--segment-accent); }
.seg .seg-btn[aria-pressed="true"] { background: var(--segment-selected-bg); color: var(--segment-accent); font-weight: 600; box-shadow: inset 0 0 0 1px var(--border-action-selected); }
.chipset { display: flex; flex-wrap: wrap; gap: var(--spacing-8); }
/* Interaction Tag (05. Components), size M. States: default, hover, active, active + hover, disabled */
.chipset .seg-btn, .fchip, .prompt-chip { display: inline-flex; align-items: center; gap: var(--spacing-4); min-height: 28px; padding: 4px 8px; border-radius: 3px; border: 0; box-shadow: inset 0 0 0 1px var(--border-static-primary); background: transparent; font-size: 12px; line-height: 16px; font-weight: 400; color: var(--foreground-moderate); cursor: pointer; text-align: left; transition: background-color .15s ease-out, color .15s ease-out, box-shadow .15s ease-out; }
.chipset .seg-btn:hover, .fchip:hover, .prompt-chip:hover { box-shadow: none; background: var(--background-action-hover-secondary); color: var(--foreground-hover-secondary); }
.chipset .seg-btn[aria-pressed="true"], .fchip[aria-pressed="true"] { box-shadow: none; background: var(--background-selected-subtle); color: var(--foreground-selected-primary); }
.chipset .seg-btn[aria-pressed="true"]:hover, .fchip[aria-pressed="true"]:hover { background: var(--background-selected-strong); color: var(--foreground-default); }
.chipset .seg-btn:disabled, .fchip:disabled { box-shadow: inset 0 0 0 1px var(--border-action-disabled); color: var(--foreground-disabled-secondary); background: transparent; cursor: not-allowed; }
.tchip { display: inline-flex; align-items: center; height: 20px; padding: 0 var(--spacing-4); border-radius: var(--radius-2); font-size: 12px; line-height: 16px; font-weight: 600; white-space: nowrap; }
.t-win { background: var(--type-win-bg); color: var(--type-win-fg); }
.t-challenge { background: var(--type-challenge-bg); color: var(--type-challenge-fg); }
.t-bug { background: var(--type-bug-bg); color: var(--type-bug-fg); }
.t-idea { background: var(--type-idea-bg); color: var(--type-idea-fg); }
.t-questions { background: var(--type-questions-bg); color: var(--type-questions-fg); }
.tdot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
.dot-win { background: var(--type-win-dot); } .dot-challenge { background: var(--type-challenge-dot); } .dot-bug { background: var(--type-bug-dot); } .dot-idea { background: var(--type-idea-dot); } .dot-questions { background: var(--type-questions-dot); }
.range-wrap { display: flex; align-items: center; gap: var(--spacing-16); max-width: 420px; }
.range-wrap input[type="range"] { flex: 1; accent-color: var(--background-action-default); height: 20px; }
.range-wrap input.untouched { opacity: .5; }
.range-wrap output { min-width: 64px; font-weight: 600; color: var(--foreground-strong); font-variant-numeric: tabular-nums; }
.rating { display: grid; gap: 6px; max-width: 360px; }
.rating .seg { display: flex; }
.rating .seg .seg-btn { flex: 1; font-variant-numeric: tabular-nums; }
.rating-ends { display: flex; justify-content: space-between; font-size: 11px; color: var(--foreground-subtle); }
.check { display: flex; gap: var(--spacing-8); align-items: center; cursor: pointer; }
.check input { width: 16px; height: 16px; margin: 0; accent-color: var(--background-action-default); flex: none; }

/* ---------- Overview ---------- */
.display { font-size: 32px; line-height: 40px; font-weight: 600; letter-spacing: -0.02em; }
.hero { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: var(--spacing-32); padding: var(--spacing-32); position: relative; overflow: hidden; }
.hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--brand-red); }
.hero.solo { grid-template-columns: minmax(0, 1fr); }
.hero-main { display: grid; gap: var(--spacing-16); align-content: start; }
.hero-main .body1 { max-width: 60ch; color: var(--foreground-moderate); }
.hero-side { display: grid; gap: var(--spacing-16); align-content: start; justify-items: center; text-align: center; border-left: 1px solid var(--border-static-secondary); padding-left: var(--spacing-32); }
.ring { position: relative; width: 112px; height: 112px; }
.ring svg { width: 112px; height: 112px; transform: rotate(-90deg); }
.ring .track-c { stroke: var(--background-hover-mild); }
.ring .bar-c { stroke: var(--background-action-default); transition: stroke-dashoffset .3s ease-out; }
.ring .val { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; }
.ring .val strong { font-size: 24px; line-height: 28px; font-weight: 600; color: var(--foreground-strong); }
.stat-list { display: grid; gap: 4px; font-size: 12px; color: var(--foreground-moderate); }
.stat-list b { color: var(--foreground-strong); font-weight: 600; }
.next-card { display: grid; gap: 4px; justify-items: start; text-align: left; width: 100%; padding: var(--spacing-12); border-radius: var(--radius-6); background: var(--background-selected-mild); border: 1px solid var(--background-selected-subtle); }
.next-card .btn { margin-top: var(--spacing-8); }
.setup-row { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--spacing-12); }
.setup-link { display: grid; grid-template-columns: 24px minmax(0, 1fr) 16px; gap: var(--spacing-12); align-items: center; padding: var(--spacing-12) var(--spacing-16); border: 1px solid var(--border-static-primary); border-radius: var(--radius-6); text-decoration: none; color: inherit; background: var(--background-secondary); }
.setup-link:hover { border-color: var(--border-action-selected); background: var(--background-selected-mild); }
.setup-link > span:nth-child(2) { display: grid; }
.setup-link > svg { width: 16px; height: 16px; color: var(--foreground-subtle); }
.setup-link.done .ask-check { background: var(--status-success-semi); border-color: var(--status-success-semi); color: #ffffff; }
.timeline { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: var(--spacing-8); }
.tl { display: grid; gap: 4px; align-content: start; padding: var(--spacing-12); border-radius: var(--radius-6); border: 1px solid var(--border-static-secondary); background: var(--background-quinary); text-decoration: none; color: inherit; min-width: 0; }
.tl:hover { border-color: var(--border-static-primary); }
.tl.next { border-color: var(--border-action-selected); background: var(--background-selected-mild); }
.tl .st-dot { margin-bottom: 4px; }
.tl.done .st-dot { background: var(--status-success-semi); border-color: var(--status-success-semi); color: #ffffff; }
.tl.next .st-dot { background: var(--background-action-default); border-color: var(--background-action-default); color: var(--foreground-on-colour); }
.tl-week { font-size: 12px; font-weight: 600; color: var(--foreground-strong); }
.tl-title { font-size: 11px; line-height: 16px; color: var(--foreground-moderate); }
.tl-status { font-size: 11px; color: var(--foreground-subtle); }
.tl.done .tl-status { color: var(--status-success-strong); font-weight: 600; }
.tl.next .tl-status { color: var(--foreground-selected-primary); font-weight: 600; }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--spacing-16); }
.way { display: flex; flex-direction: column; align-items: flex-start; gap: var(--spacing-12); }
.way-icon { width: 40px; height: 40px; border-radius: var(--radius-6); background: var(--background-selected-subtle); color: var(--foreground-selected-primary); display: grid; place-items: center; }
.way-icon svg { width: 20px; height: 20px; }
.way .time { font-size: 12px; font-weight: 600; color: var(--foreground-moderate); }
.way > .btn { margin-top: auto; }
.way > .stack-8 { margin-bottom: var(--spacing-4); }
.asks .ask { grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; }

/* ---------- Week 1 intro ---------- */
.intro { position: relative; overflow: hidden; display: grid; gap: var(--spacing-16); }
.intro::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 4px; background: var(--brand-red); }
.asks { display: grid; }
.ask { display: grid; grid-template-columns: 32px minmax(0, 1fr); gap: var(--spacing-12); align-items: start; padding: var(--spacing-12) 0; border-top: 1px solid var(--border-static-secondary); }
.ask:first-child { border-top: 0; }
.ask-check { width: 20px; height: 20px; border-radius: var(--radius-4); border: 1.5px solid var(--foreground-weak); display: grid; place-items: center; margin-top: 2px; }
.ask-check svg { width: 14px; height: 14px; }
.ask.done .ask-check { background: var(--status-success-semi); border-color: var(--status-success-semi); color: #ffffff; }
.ask-icon { width: 32px; height: 32px; border-radius: var(--radius-6); background: var(--background-selected-subtle); color: var(--foreground-selected-primary); display: grid; place-items: center; }
.ask-icon svg { width: 16px; height: 16px; }
.ask p { color: var(--foreground-moderate); font-size: 12px; line-height: 16px; margin-top: 2px; }

/* ---------- Workflow steps ---------- */
.steps { display: grid; gap: var(--spacing-12); }
.step-row { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: var(--spacing-16); padding: var(--spacing-16); border: 1px solid var(--border-static-secondary); border-radius: var(--radius-6); background: var(--background-quinary); }
.step-num { width: 28px; height: 28px; border-radius: var(--radius-4); background: var(--background-secondary); border: 1px solid var(--border-static-secondary); display: grid; place-items: center; font-weight: 600; font-size: 12px; color: var(--foreground-moderate); }
.step-fields { display: grid; gap: var(--spacing-12); min-width: 0; }
.step-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr) 160px; gap: var(--spacing-12); }
.step-grid .q-label, .step-segs .q-label { font-size: 12px; line-height: 16px; color: var(--foreground-moderate); }
.step-segs { display: flex; gap: var(--spacing-24); flex-wrap: wrap; }
.step-tools { display: flex; flex-direction: column; gap: 2px; }

/* ---------- Side panel ---------- */
.panel { position: sticky; top: calc(var(--header-h) + var(--tabs-h) + var(--spacing-24)); max-height: calc(100vh - var(--header-h) - var(--tabs-h) - var(--spacing-40)); display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.panel-top { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--spacing-8); padding: var(--spacing-12) var(--spacing-16) 0; border-bottom: 2px solid var(--border-static-primary); }
.panel-top .right { padding-bottom: 4px; }
.ptabs { display: flex; align-items: flex-end; gap: 6px; }
.panel-toggle, .panel-quick { display: none; }
.card.panel { padding: 0; }
.panel-body { padding: var(--spacing-16); display: grid; gap: var(--spacing-12); overflow-y: auto; align-content: start; }
.panel-sub { font-size: 12px; color: var(--foreground-moderate); }
.panel .composer-grid, .panel .grid-2, .panel .two { grid-template-columns: minmax(0, 1fr); }
.panel .q-label { font-size: 12px; line-height: 16px; }
.panel .prompts { display: none; }
.panel-foot { display: flex; justify-content: space-between; align-items: center; padding-top: var(--spacing-4); }
.mini { display: grid; gap: 6px; padding: var(--spacing-12); border: 1px solid var(--border-static-secondary); border-radius: var(--radius-6); background: var(--background-secondary); }
.mini-head { display: flex; align-items: center; gap: var(--spacing-8); }
.mini-head .meta { font-size: 11px; color: var(--foreground-subtle); }
.mini-head .acts { margin-left: auto; display: flex; }
.mini-title { font-size: 12px; font-weight: 600; color: var(--foreground-strong); }
.mini-what { font-size: 12px; line-height: 16px; color: var(--foreground-default); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; overflow-wrap: anywhere; }
.form-box { display: grid; gap: var(--spacing-12); padding: var(--spacing-12); border: 1px solid var(--border-action-selected); border-radius: var(--radius-6); background: var(--background-selected-mild); }
.idea-card { display: grid; gap: var(--spacing-8); padding: var(--spacing-12); border: 1px solid var(--border-static-secondary); border-radius: var(--radius-6); }
.idea-card .row-top { display: flex; gap: var(--spacing-8); align-items: flex-start; }
.idea-card .row-top .q { flex: 1; }
.idea-card .textarea { min-height: 36px; }

/* ---------- Entry form ---------- */
.composer-grid { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: var(--spacing-16) var(--spacing-24); align-items: start; }
.two { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: var(--spacing-16) var(--spacing-24); align-items: start; }
.prompts { display: flex; flex-wrap: wrap; gap: 6px; }
.dropzone { display: flex; align-items: center; gap: var(--spacing-12); padding: var(--spacing-12) var(--spacing-16); border: 1px dashed var(--border-static-primary); border-radius: var(--radius-6); background: var(--background-quinary); color: var(--foreground-moderate); cursor: pointer; font-size: 12px; }
.dropzone:hover, .dropzone.over { border-color: var(--border-action-selected); background: var(--background-selected-mild); }
.dropzone svg { width: 20px; height: 20px; flex: none; color: var(--foreground-subtle); }
.dropzone b { color: var(--foreground-link); font-weight: 600; }
.shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--spacing-12); }

<script>
/* ==========================================================================
   Glyph Early Access: participant diary prototype
   - All user input lives in window.appState (one object per participant token).
   - UI is rendered from appState. Typing only writes to state (no re-render),
     so focus and caret are never lost. Structural changes re-render the page
     and restore focus + scroll.
   - Weeks follow each participant's progress (no fixed start date): the
     "current" week is the first week not marked as done.
   - Persistence goes through loadUserData() / saveUserData() only.
   ========================================================================== */

/* ---------------------------------- Config -------------------------------- */
var CONFIG = {
  version: 'v1.3.2',
  programName: 'Glyph Early Access',
  programStart: null,                  // No start date yet. Weeks follow participant progress.
  interviewerUrl: 'https://app.heymarvin.com/interview/kLRcKtSR/',   // AI interviewer (opens in a new tab)
  driveFolderUrl: '',                  // Shared Google Drive folder: [add link]
  privacyTitle: 'How we use your notes',
  privacyNote: 'Your entries are used to improve Glyph; our product and research teams review them, and anything shared beyond the team is anonymized and compiled into broader topics.',
  privacyUrl: '',                      // Link to the full privacy document. Empty: the note above opens inside the form.
  entryTypes: [
    { id: 'win', label: 'Win' },
    { id: 'challenge', label: 'Challenge' },
    { id: 'bug', label: 'Bug' },
    { id: 'idea', label: 'Idea' },
    { id: 'questions', label: 'Questions' }
  ],
  storage: { prefix: 'glyphDiary:v1:', themeKey: 'glyphDiary:theme', warnBytes: 3500000 },
  /* Backend: the Apps Script web app URL (ends in /exec).
     While scriptUrl is empty, this file runs in PREVIEW MODE: a built-in backend in this
     browser that behaves like Code.gs, so the whole flow can be tested and demoed.
     Once scriptUrl is set, preview mode is off and Code.gs checks the program password. */
  backend: { scriptUrl: 'https://script.google.com/macros/s/AKfycbxpR1r6Wpb42oU-ICvUki8JY0wqYNn5BreX4NrNuR8MZF5zAr9ckd9m4rsBFRO6idB8/exec', forceDemo: false },
  usernamePattern: /^[a-z0-9._-]{3,30}$/,
  loginImage: ''                       // Optional URL to replace the built-in floor plan background (--login-bg in the CSS).
};

var TOKEN_RE = /^[A-Za-z0-9_-]{4,64}$/;
var TOKEN = null;
var appState = null;   // top-level var => also window.appState

/* Transient UI state: never persisted. */
var ui = {
  route: null, panelTab: 'diary', panelOpen: false, composerOpen: false, moreDetails: false,
  filterType: 'all', filterDate: 'all', dateFrom: '', dateTo: '', profileTab: 'profile', profileEdit: null, editing: null, editErrors: null, confirmDelete: null, draftErrors: {},
  sessionOpen: false, saveState: 'ok', savedAt: null, saveError: null, bytes: 0,
  auth: { mode: 'login', error: '', fieldErrors: {}, busy: false, notice: '' },
  logoutArm: false,
  openEntries: {}      // All entries page: which entry cards are expanded (collapsed by default)
};

/* ---------------------------- Backend and sync ---------------------------- */
/* All server calls go through api(): a POST with a JSON body (text/plain, so Apps
   Script needs no CORS preflight). Credentials never go in the URL.
   Saving is local-first: every change is cached in this browser with an outbox
   marker, then pushed to the server. Offline? It retries and the footer says so. */
function isDemo() { return false; }   // demo/preview mode removed: the diary always uses the live Google Sheet
function backendMissing() { return !CONFIG.backend.scriptUrl; }
var session = null;   // { username, usernameDisplay, displayName, token, rev, access }  access = the verified program password
var LS = {
  /* Browser storage, with an in-memory stand-in when the browser blocks it (some previews and

    var allOpen = shown.every(function (e) { return ui.openEntries[e.id]; });
    shown.forEach(function (e) { if (allOpen) delete ui.openEntries[e.id]; else ui.openEntries[e.id] = true; });
    renderMain(true);
  },
  clearFilters: function () { ui.filterType = 'all'; ui.filterDate = 'all'; ui.dateFrom = ''; ui.dateTo = ''; renderMain(true); },
  addStep: function () { var s = newStep(); appState.workflow.steps.push(s); if (ui.wizErrors) delete ui.wizErrors.steps; touch(); renderMain(true); focusSoon(idFor('workflow.steps#' + s.id + '.step')); },
  removeStep: function (el) { appState.workflow.steps = appState.workflow.steps.filter(function (s) { return s.id !== el.dataset.id; }); touch(); renderMain(true); },
  moveStep: function (el) {
    var a = appState.workflow.steps, i = a.findIndex(function (s) { return s.id === el.dataset.id; }), j = i + Number(el.dataset.dir);
    if (i < 0 || j < 0 || j >= a.length) return; var t = a[i]; a[i] = a[j]; a[j] = t; touch(); renderMain(true);
    var b = document.querySelector('[data-action="moveStep"][data-id="' + el.dataset.id + '"][data-dir="' + el.dataset.dir + '"]'); if (b && !b.disabled) b.focus({ preventScroll: true });
  },
  exportData: function () {
    var blob = new Blob([JSON.stringify(appState, null, 2)], { type: 'application/json' });
    var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'glyph-diary-' + todayISO() + '.json';
    document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  }
};
function generateToken() {
  var abc = 'abcdefghjkmnpqrstuvwxyz23456789', out = '', bytes = new Uint8Array(12);
  window.crypto.getRandomValues(bytes);
  for (var i = 0; i < bytes.length; i++) out += abc[bytes[i] % abc.length];
  return out;
}

/* --------------------------------- Events --------------------------------- */
document.addEventListener('submit', function (e) { if (e.target.id === 'auth-form') { e.preventDefault(); if (!ui.auth.busy) submitAuth(e.target); } });
document.addEventListener('input', function (e) {
  var el = e.target; if (!el.dataset || !el.dataset.bind || el.dataset.kind === 'checkbox') return;
  var v = el.value;
  if (el.dataset.kind === 'number') v = v === '' ? '' : Number(v);
  if (el.dataset.kind === 'range') { v = Number(v); el.classList.remove('untouched'); var out = document.querySelector('[data-out="' + CSS.escape(el.dataset.bind) + '"]'); if (out) out.textContent = v + '%'; }
  setPath(el.dataset.bind, v);
  if (el.classList.contains('invalid') && filled(v)) el.classList.remove('invalid');
  touch();
});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.dataset && el.dataset.kind === 'checkbox') { setPath(el.dataset.bind, el.checked); touch(); return; }
  if (el.dataset && el.dataset.imagesFor) { addImages(el.dataset.imagesFor, el.files); el.value = ''; }
  if (el.dataset && el.dataset.filterDate) { ui[el.dataset.filterDate] = el.value; renderMain(true); }
});
document.addEventListener('click', function (e) {
  var opt = e.target.closest('[data-opt]');
  if (opt) {
    var g = opt.closest('[data-group]'); if (!g) return;
    var path = g.dataset.bind, isNum = g.hasAttribute('data-num'), val = isNum ? Number(opt.dataset.opt) : opt.dataset.opt;
    if (g.dataset.mode === 'multi') { var arr = (getPath(path) || []).slice(), i = arr.indexOf(val); if (i > -1) arr.splice(i, 1); else arr.push(val); setPath(path, arr); }
    else setPath(path, getPath(path) === val ? (isNum ? null : '') : val);
    var cur = getPath(path);
    g.querySelectorAll('[data-opt]').forEach(function (b) { var bv = isNum ? Number(b.dataset.opt) : b.dataset.opt; b.setAttribute('aria-pressed', String(Array.isArray(cur) ? cur.indexOf(bv) > -1 : cur === bv)); });
    if (/\.type$/.test(path)) { var q = g.closest('.q'); var er = q && q.querySelector('.field-error'); if (er) er.remove(); }
    if (g.hasAttribute('data-rerender')) { if (ui.wizErrors) { delete ui.wizErrors.steps; delete ui.wizErrors.role; } touch(); renderMain(true); var again = document.querySelector('[data-group][data-bind="' + CSS.escape(path) + '"] [data-opt="' + CSS.escape(String(val)) + '"]'); if (again) again.focus({ preventScroll: true }); return; }
    touch(); return;
  }
  var act = e.target.closest('[data-action]');
  if (act && ACTIONS[act.dataset.action]) { e.preventDefault(); ACTIONS[act.dataset.action](act, e); return; }
});
document.addEventListener('keydown', function (e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('dropzone')) { e.preventDefault(); var f = e.target.querySelector('input[type=file]'); if (f) f.click(); }
});
document.addEventListener('dragover', function (e) { var z = e.target.closest && e.target.closest('[data-drop-for]'); if (z) { e.preventDefault(); z.classList.add('over'); } });
document.addEventListener('dragleave', function (e) { var z = e.target.closest && e.target.closest('[data-drop-for]'); if (z) z.classList.remove('over'); });
document.addEventListener('drop', function (e) { var z = e.target.closest && e.target.closest('[data-drop-for]'); if (z) { e.preventDefault(); z.classList.remove('over'); addImages(z.dataset.dropFor, e.dataTransfer.files); } });
document.addEventListener('paste', function (e) {
  if (!TOKEN || !e.clipboardData) return;
  var files = Array.prototype.filter.call(e.clipboardData.files || [], function (f) { return /^image\//.test(f.type); });
  if (!files.length) return;
  e.preventDefault();
  if (ui.editing) { addImages('entries#' + ui.editing + '.', files); return; }
  if (ui.route !== 'entries') { ui.pendingComposer = 'more'; go('entries'); }
  addImages('draft.', files);
});

/* ---------------------------------- Boot ---------------------------------- */
async function start() {
  var saved = LS.get(KEY.session());
  if (!saved || !saved.token || !saved.username || !saved.access) { LS.del(KEY.session()); showAuth(); return; }
  session = saved; TOKEN = saved.username;
  var cached = await loadUserData();
  appState = window.appState = prepareState(cached);
  document.getElementById('shell').classList.remove('auth-shell');
  ui.savedAt = cached ? appState.meta.updatedAt : null;
  renderHeader(); renderFooter(); applyRoute(false);
  if (LS.get(KEY.outbox(saved.username))) flushOutbox();
  syncFromServer();
}
start();
</script>
